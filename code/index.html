</style></head><body><main class="wrap"><div class="top"><a class="btn" href="../">← Omni Phi</a><button class="menuBtn" id="machineToggle" aria-label="Open iteration machine">☰</button><h1>Code φ</h1><span class="status" id="status">Connecting search…</span></div><div class="token" id="token"></div><div class="grid"><section class="panel"><h2>Live HTML build</h2><iframe class="viewer" id="viewer" sandbox="allow-scripts allow-forms"></iframe><div class="refine"><textarea id="direction" placeholder="After you see the build, add a direction for the next iteration…"></textarea><button id="iterate">Iterate</button><button id="finalDeploy">Final Deploy Website</button></div><p class="muted" id="browserState">Browser verification: waiting for a connected Cloud Browser backend.</p></section></div><section class="panel machine" id="machine"><div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1">GPT iteration machine</h2><button id="machineClose" aria-label="Close iteration machine" style="padding:6px 10px">✕</button></div><div class="refine"><textarea id="machineDirection" placeholder="Tell GPT what to change or build next…"></textarea><button id="machineSend">Build</button></div><div class="suggest" id="suggestions"></div><div class="feed" id="feed"></div></section></main><script src="../assets/app.js?v=20260921-unified-rewards5"></script><script src="../assets/capability-router.js?v=20260920-c13b0-catalog1"></script><script src="./card-system.js?v=20260921-card4"></script><script>
(()=>{const BACKEND='https://orange-brook-a2ac.marvaseater.workers.dev',WORK_BACKEND='https://infinity-work-tickets.marvaseater.workers.dev';const p=new URLSearchParams(location.search),seed=(()=>{try{return JSON.parse(localStorage.getItem('omniPhi:codeSeed:v1')||'null')}catch{return null}})(),active=window.OmniPhi?.activeResearch?.(),query=(p.get('q')||seed?.query||active?.query||'').trim(),tokenId=(p.get('token')||seed?.tokenId||active?.createdAt||('code-'+Date.now())),feed=document.querySelector('#feed'),viewer=document.querySelector('#viewer'),status=document.querySelector('#status'),direction=document.querySelector('#direction'),browserState=document.querySelector('#browserState');document.querySelector('#token').textContent='Original Omni search: '+(query||'No search received')+' · Token: '+tokenId;const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let iteration=0;const applied=[];function log(title,detail,state='run'){const d=document.createElement('div');d.className='step '+state;d.innerHTML='<b>'+esc(title)+'</b><small>'+esc(detail)+'</small>';feed.appendChild(d);feed.scrollTop=feed.scrollHeight;return d}function finish(node,state,detail){node.className='step '+state;if(detail)node.querySelector('small').textContent=detail}function wireSuggestions(){const box=document.querySelector('#suggestions'),items=window.InfinityPhiCards?.actions(query,viewer.srcdoc)||[];box.replaceChildren();items.forEach(label=>{const b=document.createElement('button');b.dataset.suggest=label;b.textContent=label;b.onclick=()=>{machineDirection.value=label;build(label)};box.appendChild(b)})}async function remote(path,body,timeout=5000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(BACKEND+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:c.signal});if(!r.ok)throw new Error(path+' '+r.status);return await r.json()}finally{clearTimeout(t)}}async function searchImages(term){try{const variants=[term,term+' photos artwork',term+' poster magazine cover',term+' vintage memorabilia'];const batches=await Promise.all(variants.map(async v=>{const u=new URL(BACKEND+'/search');u.search=new URLSearchParams({q:v,categories:'images',format:'json',pageno:'1',safesearch:'1'});const r=await fetch(u,{cache:'no-store'});if(!r.ok)return[];const j=await r.json();return (j.results||[]).map(x=>({url:x.img_src||x.thumbnail_src||x.thumbnail||x.image||'',href:x.url||x.source_url||'#',title:x.title||term})).filter(x=>x.url)}));const seen=new Set();return batches.flat().filter(x=>/^https?:\/\//i.test(x.url)&&!seen.has(x.url)&&seen.add(x.url)).slice(0,50)}catch{return[]}}async function fallbackKnowledge(term){try{const u=new URL('https://en.wikipedia.org/w/api.php');u.search=new URLSearchParams({action:'query',generator:'search',gsrsearch:term,gsrlimit:'12',prop:'extracts|info',exintro:'1',explaintext:'1',inprop:'url',format:'json',origin:'*'});const j=await fetch(u).then(r=>r.json());return Object.values(j.query?.pages||{}).map(x=>({title:x.title,url:x.fullurl,content:x.extract||''}))}catch{return[]}}async function fallbackImages(term){try{const u=new URL('https://commons.wikimedia.org/w/api.php');u.search=new URLSearchParams({action:'query',generator:'search',gsrsearch:term,gsrnamespace:'6',gsrlimit:'18',prop:'imageinfo',iiprop:'url',iiurlwidth:'640',format:'json',origin:'*'});const j=await fetch(u).then(r=>r.json());return Object.values(j.query?.pages||{}).map(x=>({title:x.title,url:x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url||'',href:x.imageinfo?.[0]?.descriptionurl||'#'})).filter(x=>x.url)}catch{return[]}}async function archiveMedia(term){try{const u=new URL('https://archive.org/advancedsearch.php');u.search=new URLSearchParams({q:'("'+term.replace(/["()]/g,' ')+'") AND mediatype:(audio OR movies)',rows:'20',page:'1',output:'json'});['identifier','title','description','mediatype'].forEach(field=>u.searchParams.append('fl[]',field));const j=await fetch(u).then(r=>r.json());return (j.response?.docs||[]).map(x=>({id:x.identifier,title:x.title||term,description:Array.isArray(x.description)?x.description[0]:x.description||'',type:x.mediatype,url:'https://archive.org/details/'+x.identifier}))}catch{return[]}}function collectVisuals(){const out=[];try{const keys=['omniPhi:imageSelections:v1','omniPhi:selectedImages:v1','infinityPhi:imageSelections:v1','infinityPhi:selectedImages:v1','phi:selectedImages','omniPhi:collection:v1','infinityPhi:collection:v1'];keys.forEach(k=>{const v=JSON.parse(localStorage.getItem(k)||'[]');(Array.isArray(v)?v:[]).forEach(x=>{const u=x.imageUrl||x.img_src||x.thumbnail_src||x.thumbnail||x.image||x.src;if(u&&x.tokenId&&String(x.tokenId)===String(tokenId))out.push({url:u,href:x.sourceUrl||x.url||x.source||'#',title:x.sourceTitle||x.title||query,extract:x.sourceExtract||x.extract||''})})})}catch{}return out}async function render(route,n,note){const tools=route.repositories||[],q=(query+' '+(note||'')).toLowerCase(),gallery=/\b(image|images|photo|photos|picture|pictures|poster|posters|gallery)\b/.test(q),cols=/4 cards|4 cards per row/.test(q)?4:/2 cards|2 cards per row/.test(q)?2:/responsive card grid/.test(q)?3:0,masonry=/masonry/.test(q),nav=/hamburger/.test(q),polish=/visual design|spacing|image crops/.test(q),subject=esc(query.replace(/\b(image|photo|picture|poster|art|gallery|visual)s?\b/ig,'').trim()||query);if(gallery){let saved=collectVisuals();if(!saved.length)saved=await searchImages(query);viewer.srcdoc='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;background:#111;color:#fff}header{padding:24px}h1{margin:0}.grid{display:grid;grid-template-columns:repeat('+(cols||'auto-fill')+','+(cols?'minmax(0,1fr)':'minmax(180px,1fr)')+');gap:'+(polish?'18':'10')+'px;padding:'+(polish?'18':'10')+'px}.tile{aspect-ratio:'+(masonry?'auto':'1')+';min-height:'+(masonry?'180px':'0')+';background:#282828;border-radius:'+(polish?'20':'14')+'px;overflow:hidden;display:grid;place-items:center}.tile img{width:100%;height:100%;object-fit:cover}.muted{color:#aaa}.hamb{display:'+(nav?'block':'none')+';position:fixed;right:16px;top:16px;z-index:5;border:0;border-radius:12px;padding:10px 12px;font-size:22px}</style><button class="hamb" onclick="document.body.classList.toggle(\'menu-open\')">☰</button><header><h1>'+subject+' gallery</h1><p class="muted">Loading visual results…</p></header><main class="grid" id="gallery">'+saved.slice(0,30).map(x=>'<a class="tile" href="'+esc(x.href)+'" target="_blank"><img loading="lazy" src="'+esc(x.url)+'" alt="'+esc(x.title)+'"></a>').join('')+'</main><script>const existing=document.querySelectorAll("#gallery img").length;if(existing){document.querySelector(".muted").textContent=existing+" images from this Omni/Infinity research token"}else fetch("https://orange-brook-a2ac.marvaseater.workers.dev/search?"+new URLSearchParams({q:'+JSON.stringify(query+' images')+',format:"json"})).then(r=>r.json()).then(d=>{const xs=(d.results||[]).filter(x=>x.img_src||x.thumbnail);document.querySelector("#gallery").innerHTML=xs.slice(0,30).map(x=>"<a class=tile href=\""+(x.url||"#")+"\" target=_blank><img loading=lazy src=\""+(x.img_src||x.thumbnail)+"\" alt=\"\"></a>").join("");document.querySelector(".muted").textContent=xs.length?xs.length+" images":"No image results returned"}).catch(()=>document.querySelector(".muted").textContent="Image feed unavailable")<\/script>';return}const blueprint=window.InfinityPhiCards?.infer(query)||{kind:'research-publication'};const expansions=blueprint.kind==='music-archive'?[query+' biography',query+' discography albums songs',query+' archive interviews magazine articles',query+' concerts films documentaries',query+' cultural influence']:blueprint.kind==='story-collection'?[query,query+' complete stories',query+' historical context',query+' art images',query+' audio video']: [query,query+' overview',query+' history',query+' articles'];let results=[];try{const batches=await Promise.all(expansions.map(async term=>{const webUrl=new URL(BACKEND+'/search');webUrl.search=new URLSearchParams({q:term,format:'json',categories:'general',safesearch:'1'});const response=await fetch(webUrl,{cache:'no-store'});if(!response.ok)return[];const data=await response.json();return data.results||[]}));const seen=new Set();results=batches.flat().filter(x=>x.title&&x.url&&!/omni-phi\/code/i.test(x.url)&&!seen.has(x.url)&&seen.add(x.url)).slice(0,36)}catch{}if(!results.length)results=await fallbackKnowledge(query);let visuals=collectVisuals();if(!visuals.length)visuals=await searchImages(query);if(!visuals.length)visuals=await fallbackImages(query);const media=await archiveMedia(blueprint.title||query);viewer.srcdoc=window.InfinityPhiCards?.render(query,results,note,visuals,tokenId,media)||'<h1>'+esc(query)+'</h1>'}async function build(note=''){if(note&&!applied.includes(note))applied.push(note);const combined=applied.join(' · ');iteration++;status.textContent='Iteration '+iteration+' building…';const intent=log('Iteration '+iteration+' · Read intent',(query||'Omni search')+(note?' + '+note:''));const route=window.OmniCapabilityRouter?.route([query,combined].filter(Boolean).join(' '),viewer.srcdoc)||{repositories:[],suggestions:[]};finish(intent,'pass','Intent connected to original Omni token.');const discover=log('Discover capabilities','Matching this iteration against the C13b0 Code Phi tool catalog.');(route.repositories||[]).forEach(t=>log('Pull '+t.id,t.repo+' — '+t.role,'pass'));finish(discover,'pass',(route.repositories||[]).length+' indexed capabilities selected.');const assemble=log('Search + assemble','Pulling fresh results for this exact token, then building the requested product.');viewer.srcdoc='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font:16px system-ui;padding:28px"><h2>Building '+esc(query)+'…</h2><p>Loading fresh content for this token.</p></body>';await render(route,iteration,combined);finish(assemble,'pass','Fresh token results wired into the live HTML viewer.');wireSuggestions();const inspect=log('Structure build','Turn the original request into an ordered build plan now: research/evidence → media → content → layout/design → interactions → quality pass.');let plan={query,direction:combined,stages:['research/evidence','media','content structure','layout/design','interactions','quality pass'],tools:(route.repositories||[]).map(x=>x.id)};finish(inspect,'pass','GPT is actively planning the next build pass from this token.');remote('/code-phi/plan',{query,tokenId,direction:combined,iteration,route},5000).then(remotePlan=>{plan={...plan,...remotePlan};log('GPT plan joined',plan.summary||'Orange Brook strengthened this iteration plan.','pass')}).catch(()=>{});const browser=log('Cloud Browser self-view','Cloudflare Browser inspects the rendered HTML, then GPT reports missing pieces and repairs.');browserState.textContent='Browser verification: Cloudflare Browser + GPT inspection running…';const htmlForReview=viewer.srcdoc;remote('/code-phi/inspect',{query,tokenId,iteration,html:htmlForReview,plan,requirements:['surface broken layout and empty sections','use all token-selected image video and audio','check mobile and accessibility','check loading empty and error states','check metadata sources and deploy readiness']}).then(review=>{finish(browser,'pass',review.summary||'GPT completed the missing-piece inspection.');browserState.textContent='AI inspection: passed iteration '+iteration+'.';(review.issues||[]).slice(0,6).forEach(issue=>log('Missing piece',issue,'fail'));if(review&&review.html){localStorage.setItem('codePhi:repairProposal:v1',JSON.stringify({query,tokenId,iteration,html:review.html,issues:review.issues||[],repairs:review.repairs||[],createdAt:new Date().toISOString()}));log('Repair proposal indexed','GPT suggestions were saved for the next ranked iteration without replacing the working Infinity page.','pass')}}).catch(e=>{finish(browser,'fail',String(e.message||e));browserState.textContent='Browser verification: unavailable; local Code Phi build remains active.';});const asset={schema:'infinity-code-asset/v1',id:'asset-'+tokenId+'-'+iteration,name:(query||'Infinity')+' View',query,tokenId,iteration,direction:combined,route,html:viewer.srcdoc,createdAt:new Date().toISOString(),creator:'Code Phi',origin:'generated'};localStorage.setItem('omniPhi:codeBuild:v3',JSON.stringify(asset));const assets=JSON.parse(localStorage.getItem('infinity:codeAssets:v1')||'[]').filter(x=>x.id!==asset.id);assets.unshift(asset);localStorage.setItem('infinity:codeAssets:v1',JSON.stringify(assets.slice(0,100)));status.textContent='Iteration '+iteration+' rendered';}document.querySelector('#iterate').onclick=()=>build(direction.value.trim());document.querySelector('#finalDeploy').onclick=()=>{const asset={schema:'code-phi-deploy/v1',query,tokenId,iteration,html:viewer.srcdoc,direction:applied.join(' · '),createdAt:new Date().toISOString(),status:'ready'};localStorage.setItem('codePhi:deployReady:v1',JSON.stringify(asset));status.textContent='Website packaged for final deployment';log('Deploy package ready','Saved under this research token. Web Phi publishing is the next handoff.','pass');};const machine=document.querySelector('#machine'),machineDirection=document.querySelector('#machineDirection');document.querySelector('#machineToggle').onclick=()=>machine.classList.toggle('open');document.querySelector('#machineClose').onclick=()=>machine.classList.remove('open');document.querySelector('#machineSend').onclick=()=>{const v=machineDirection.value.trim();if(v){build(v);machineDirection.value=''}};document.querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>{const s=b.dataset.suggest;machineDirection.value=s;build(s)});if(query)build();else status.textContent='No Omni search received';})();

(function(){
 const box=document.querySelector('#rankedActions');

 const currentToken=new URLSearchParams(location.search).get('token')||read('omniPhi:lastSearchToken:v1',{})?.tokenId||'';

 const browserText=document.querySelector('#browserState')?.textContent||'';
 const state={hasArtifact,incomplete:!hasArtifact,blockingError:/error|failed|broken/i.test(browserText)||!!ticket,unusedSelectedMedia:unused,verified:/verified|pass/i.test(browserText),published:false};

 };
 CodePhiActionEngine.render(box,choice,item=>{

  const input=document.querySelector('#machineDirection');
  if(input)input.value=prompts[item.id]||item.label;
  document.querySelector('#machineToggle')?.click();
 });
