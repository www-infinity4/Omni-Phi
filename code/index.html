';return}viewer.srcdoc='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;padding:28px;background:#fff;color:#21152a}header{padding:28px;border-radius:20px;background:#f4eaff}h1{margin:0 0 8px;color:#642b8e}.card{margin:14px 0;padding:16px;border:1px solid #ddd;border-radius:14px}small{color:#6d6074}</style><header><h1>'+esc(query)+'</h1><p>Code Phi build iteration '+n+'</p></header>'+(note?'<div class="card"><b>New direction</b><p>'+esc(note)+'</p></div>':'')+tools.map(t=>'<div class="card"><b>'+esc(t.role)+'</b><p>'+esc(t.repo)+'</p><small>Plugged for: '+esc((t.matches||[]).join(', '))+'</small></div>').join('')+'<div class="card"><b>Build state</b><p>This is the rendered HTML product surface. Further iterations replace this view rather than dumping source code.</p></div>'}async function build(note=''){if(note&&!applied.includes(note))applied.push(note);const combined=applied.join(' · ');iteration++;status.textContent='Iteration '+iteration+' building…';const intent=log('Iteration '+iteration+' · Read intent',(query||'Omni search')+(note?' + '+note:''));const route=window.OmniCapabilityRouter?.route([query,combined].filter(Boolean).join(' '),viewer.srcdoc)||{repositories:[],suggestions:[]};finish(intent,'pass','Intent connected to original Omni token.');const discover=log('Discover capabilities','Matching this iteration against the C13b0 Code Phi tool catalog.');(route.repositories||[]).forEach(t=>log('Pull '+t.id,t.repo+' — '+t.role,'pass'));finish(discover,'pass',(route.repositories||[]).length+' indexed capabilities selected.');const assemble=log('Search + assemble','Pulling fresh results for this exact token, then building the requested product.');viewer.srcdoc='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font:16px system-ui;padding:28px"><h2>Building '+esc(query)+'…</h2><p>Loading fresh content for this token.</p></body>';await render(route,iteration,combined);finish(assemble,'pass','Fresh token results wired into the live HTML viewer.');wireSuggestions();const inspect=log('Structure build','Turn the original request into an ordered build plan now: research/evidence → media → content → layout/design → interactions → quality pass.');let plan={query,direction:combined,stages:['research/evidence','media','content structure','layout/design','interactions','quality pass'],tools:(route.repositories||[]).map(x=>x.id)};finish(inspect,'pass','Local iteration plan active; GPT planning is optional and runs in background.');remote('/code-phi/plan',{query,tokenId,direction:combined,iteration,route},5000).then(remotePlan=>{plan={...plan,...remotePlan};log('GPT plan joined',plan.summary||'Orange Brook strengthened this iteration plan.','pass')}).catch(()=>{});const browser=log('Cloud Browser self-view','Cloudflare Browser inspects the rendered HTML, then GPT reports missing pieces and repairs.');browserState.textContent='Browser verification: Cloudflare Browser + GPT inspection running…';const htmlForReview=viewer.srcdoc;remote('/code-phi/inspect',{query,tokenId,iteration,html:htmlForReview,plan,requirements:['surface broken layout and empty sections','use all token-selected image video and audio','check mobile and accessibility','check loading empty and error states','check metadata sources and deploy readiness']}).then(review=>{finish(browser,'pass',review.summary||'GPT completed the missing-piece inspection.');browserState.textContent='AI inspection: passed iteration '+iteration+'.';(review.issues||[]).slice(0,6).forEach(issue=>log('Missing piece',issue,'fail'));if(review&&review.html){viewer.srcdoc=review.html;log('Repair applied','GPT returned a repaired HTML iteration.','pass')}}).catch(e=>{finish(browser,'fail',String(e.message||e));browserState.textContent='Browser verification: unavailable; local Code Phi build remains active.';});const asset={schema:'infinity-code-asset/v1',id:'asset-'+tokenId+'-'+itera
