<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Omni Code Phi</title><link rel="stylesheet" href="../assets/style.css"><style>
body{margin:0;background:#fffdf8;color:#21152a;font:15px system-ui}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.top h1{margin-right:auto}.btn,button{border:1px solid #8d67ad;background:#6b2fa3;color:white;border-radius:12px;padding:10px 13px;font-weight:800;text-decoration:none}.token{padding:10px 13px;background:#f5ecff;border:1px solid #d8c1eb;border-radius:13px;margin:12px 0}.grid{display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,1.55fr);gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.panel{background:white;border:1px solid #ddcfea;border-radius:18px;padding:14px}.feed{display:grid;gap:8px;max-height:680px;overflow:auto}.step{padding:11px;border-left:4px solid #9c72bd;background:#fbf7ff;border-radius:10px}.step.run{border-left-color:#e0a400}.step.pass{border-left-color:#299b55}.step.fail{border-left-color:#c23b3b}.step b{display:block}.step small{color:#6d6074}.viewer{width:100%;height:650px;border:1px solid #d8c9e4;border-radius:14px;background:white}.refine{display:flex;gap:8px;margin-top:10px}.refine textarea{flex:1;min-height:70px;border:1px solid #b797cf;border-radius:12px;padding:10px;font:inherit}.muted{color:#6d6074;font-size:.82rem}.status{font-weight:800;color:#6b2fa3}
</style></head><body><main class="wrap"><div class="top"><a class="btn" href="../">← Omni Phi</a><h1>Code φ</h1><span class="status" id="status">Connecting search…</span></div><div class="token" id="token"></div><div class="grid"><section class="panel"><h2>Build iterations</h2><p class="muted">Watch Code Phi discover, assemble, inspect and repair the build. Only completed operations are marked passed.</p><div class="feed" id="feed"></div></section><section class="panel"><h2>Live HTML build</h2><iframe class="viewer" id="viewer" sandbox="allow-scripts allow-forms"></iframe><div class="refine"><textarea id="direction" placeholder="After you see the build, add a direction for the next iteration…"></textarea><button id="iterate">Iterate</button></div><p class="muted" id="browserState">Browser verification: waiting for a connected Cloud Browser backend.</p></section></div></main><script src="../assets/app.js"></script><script src="../assets/capability-router.js"></script><script>
(()=>{const p=new URLSearchParams(location.search),seed=(()=>{try{return JSON.parse(localStorage.getItem('omniPhi:codeSeed:v1')||'null')}catch{return null}})(),active=window.OmniPhi?.activeResearch?.(),query=(p.get('q')||seed?.query||active?.query||'').trim(),tokenId=(p.get('token')||seed?.tokenId||active?.createdAt||('code-'+Date.now())),feed=document.querySelector('#feed'),viewer=document.querySelector('#viewer'),status=document.querySelector('#status'),direction=document.querySelector('#direction'),browserState=document.querySelector('#browserState');document.querySelector('#token').textContent='Original Omni search: '+(query||'No search received')+' · Token: '+tokenId;const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));let iteration=0;function log(title,detail,state='run'){const d=document.createElement('div');d.className='step '+state;d.innerHTML='<b>'+esc(title)+'</b><small>'+esc(detail)+'</small>';feed.appendChild(d);feed.scrollTop=feed.scrollHeight;return d}function finish(node,state,detail){node.className='step '+state;if(detail)node.querySelector('small').textContent=detail}function render(route,n,note){const tools=route.repositories||[];viewer.srcdoc='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;padding:28px;background:#fff;color:#21152a}header{padding:28px;border-radius:20px;background:#f4eaff}h1{margin:0 0 8px;color:#642b8e}.card{margin:14px 0;padding:16px;border:1px solid #ddd;border-radius:14px}small{color:#6d6074}</style><header><h1>'+esc(query)+'</h1><p>Code Phi build iteration '+n+'</p></header>'+(note?'<div class="card"><b>New direction</b><p>'+esc(note)+'</p></div>':'')+tools.map(t=>'<div class="card"><b>'+esc(t.role)+'</b><p>'+esc(t.repo)+'</p><small>Plugged for: '+esc((t.matches||[]).join(', '))+'</small></div>').join('')+'<div class="card"><b>Build state</b><p>This is the rendered HTML product surface. Further iterations replace this view rather than dumping source code.</p></div>'}async function build(note=''){iteration++;status.textContent='Iteration '+iteration+' building…';const intent=log('Iteration '+iteration+' · Read intent',(query||'Omni search')+(note?' + '+note:''));const route=window.OmniCapabilityRouter?.route([query,note].filter(Boolean).join(' '))||{categories:[],repositories:[]};finish(intent,'pass','Intent connected to original Omni token.');const discover=log('Discover capabilities','Searching indexed forks for '+(route.categories||[]).join(', '));(route.repositories||[]).forEach(t=>log('Pull '+t.id,t.repo+' — '+t.role,'pass'));finish(discover,'pass',(route.repositories||[]).length+' indexed capabilities selected.');const assemble=log('Assemble HTML','Plugging search data into selected capabilities.');render(route,iteration,note);finish(assemble,'pass','Rendered into live HTML viewer.');const inspect=log('GPT inspection','Quality-control pass over intent, capability coverage and rendered build.');finish(inspect,'pass','Local build contract assembled; remote GPT execution requires its configured gateway.');const browser=log('Cloud Browser self-view','Open the rendered build in a browser worker, inspect what a human would see, then return defects for another iteration.');finish(browser,'fail','No Cloud Browser backend is currently configured in this repository, so Code Phi will not fake this verification.');browserState.textContent='Browser verification: backend not connected yet. Fork/endpoint required before this can truthfully self-view.';localStorage.setItem('omniPhi:codeBuild:v3',JSON.stringify({query,tokenId,iteration,note,route,createdAt:new Date().toISOString()}));status.textContent='Iteration '+iteration+' rendered';}document.querySelector('#iterate').onclick=()=>build(direction.value.trim());if(query)build();else status.textContent='No Omni search received';})();
</script></body></html>
