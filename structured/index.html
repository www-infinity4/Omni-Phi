<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Omni Phi — Collected Stories</title>
  <meta name="description" content="Full reads created from the orange source cards collected in Omni Phi." />
  <meta name="theme-color" content="#07071c" />
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body class="content-page stories-page">
  <div id="topbar"></div>
  <main class="site-shell">
    <section class="page-hero">
      <div class="page-kicker">Page 3 · Collected Stories</div>
      <h1 class="page-title" id="pageTitle">Building your full reads…</h1>
      <p class="page-subtitle">Every orange card you collect becomes its own readable story here. The article stays connected to its evidence while expanding the subject into a clean reading path.</p>
      <nav class="pill-nav" aria-label="Research views">
        <a id="overviewLink" href="../overview/">AI Overview</a>
        <a class="active" href="./">Full Stories</a>
        <a id="cardsLink" href="../cards/">Indexed Data</a>
        <a href="../ecosystem/">Omni Line</a>
      </nav>
    </section>

    <section id="stories"><div class="panel loading">Opening collected cards</div></section>
  </main>

  <script src="../assets/omni-family.js"></script>
  <script src="../assets/indexer.js"></script>
  <script src="../assets/app.js"></script>
  <script src="../assets/capability-router.js"></script>
  <script src="../assets/smart-search.js"></script>
  <script>
    document.getElementById('topbar').innerHTML = OmniPhi.topbar('OMNI PHI', 'collected stories');
    OmniPhi.setupMenu();

    const params = new URLSearchParams(location.search);
    const q = (params.get('q') || OmniPhi.activeResearch()?.query || 'Corn').trim();
    const mode = params.get('mode') || OmniPhi.activeResearch()?.mode || 'search';
    const navParams = new URLSearchParams({q, mode});
    const stories = document.getElementById('stories');

    document.getElementById('pageTitle').textContent = `${q} — collected stories`;
    document.getElementById('overviewLink').href = `${OmniPhi.url('overview/')}?${navParams}`;
    document.getElementById('cardsLink').href = `${OmniPhi.url('cards/')}?${navParams}`;

    const keyOf = (source) => source.url || source.id || source.title || '';
    const sentences = (text) => String(text || '').replace(/\s+/g, ' ').trim().split(/(?<=[.!?])\s+/).filter(Boolean);

    function storyTitle(source, index, used) {
      const text = `${source.title || ''} ${source.extract || ''}`.toLowerCase();
      let title = String(source.title || `${q} study`).replace(/\s*\([^)]*\)\s*/g, ' ').replace(/\s+/g, ' ').trim();
      if (/\bhydrogen\b/i.test(q)) {
        const choices = [
          [/engine|combustion|vehicle/, 'Hydrogen Engine'],
          [/gas|gaseous|molecule|properties/, 'Hydrogen Gas Studies'],
          [/fuel cell|electrochemical/, 'Hydrogen Fuel Cells'],
          [/produc|electrolysis|reform/, 'Hydrogen Production'],
          [/stor|tank|hydride/, 'Hydrogen Storage Systems'],
          [/safe|flamm|explos/, 'Hydrogen Safety'],
          [/transport|pipeline|distribution/, 'Hydrogen Transportation']
        ];
        title = choices.find(([pattern]) => pattern.test(text))?.[1] || title;
      }
      if (!title || /\bmeaning\b|\boverview\b|\bdefinition\b/i.test(title)) title = `${q} Study ${index + 1}`;
      if (used.has(title)) title = `${title}: ${String(source.title || `Study ${index + 1}`).replace(/\s*\([^)]*\)\s*/g, '').trim()}`;
      used.add(title);
      return title;
    }

    function articleCopy(source, title) {
      const parts = sentences(source.extract);
      if (!parts.length) return `<p>This collected card is ready for a fuller evidence source. Its current place in the reading set connects <strong>${OmniPhi.escapeHtml(title)}</strong> directly to ${OmniPhi.escapeHtml(q)}.</p>`;
      const groups = [];
      for (let i = 0; i < parts.length; i += 3) groups.push(parts.slice(i, i + 3).join(' '));
      return groups.map((paragraph) => `<p>${OmniPhi.escapeHtml(paragraph)}</p>`).join('');
    }

    function render(record, availableSources) {
      const profile = OmniPhi.profile();
      const available = new Map(availableSources.map((source) => [keyOf(source), source]));
      const selected = (profile.collected || []).map((saved) => ({...saved, ...(available.get(keyOf(saved)) || {})})).filter((source) => {
        const haystack = `${source.title || ''} ${source.extract || ''}`.toLowerCase();
        return haystack.includes(q.toLowerCase()) || (record.sources || []).some((candidate) => keyOf(candidate) === keyOf(source));
      });

      if (!selected.length) {
        stories.innerHTML = `<section class="panel empty-stories"><div class="topic-orb">φ</div><h2>Choose the stories you want to read</h2><p>Collect one or more orange cards on page two. Each selected card will open here as a full story.</p><a href="${OmniPhi.url('overview/')}?${navParams}">Return to orange cards</a></section>`;
        return;
      }

      const used = new Set();
      stories.innerHTML = selected.map((source, index) => {
        const title = storyTitle(source, index, used);
        return `<article class="story-feature">
          ${source.image ? `<img class="story-image" src="${OmniPhi.escapeHtml(source.image)}" alt="" loading="lazy" />` : `<div class="story-image story-image-fallback"><span>φ</span></div>`}
          <div class="story-body">
            <div class="story-number">Collected card ${String(index + 1).padStart(2, '0')}</div>
            <h2>${OmniPhi.escapeHtml(title)}</h2>
            <p class="story-source">${OmniPhi.escapeHtml(source.provider || source.domain || 'Evidence source')}</p>
            <div class="story-copy">${articleCopy(source, title)}</div>
            <div class="story-actions">
              ${source.url ? `<a href="${OmniPhi.escapeHtml(source.url)}" target="_blank" rel="noopener">Open evidence source</a>` : ''}
              <a href="${OmniPhi.url('cards/')}?${new URLSearchParams({q:title, mode})}">Index this story</a>
            </div>
          </div>
        </article>`;
      }).join('') + `<div class="story-next"><a href="${OmniPhi.url('cards/')}?${navParams}">Open indexed data and purple next-search cards →</a></div>`;
    }

    async function load() {
      let record = OmniPhi.activeResearch();
      let sources = record && String(record.query || '').toLowerCase() === q.toLowerCase() ? (record.sources || []) : [];
      if (!sources.length) {
        try { sources = await OmniPhi.fetchWikipedia(q); } catch (error) { console.warn(error); }
      }
      if (!sources.length) sources = OmniPhi.fallbackSources(q);
      if (!record || String(record.query || '').toLowerCase() !== q.toLowerCase()) record = OmniPhi.createResearch(q, mode, sources);
      render(record, [...sources, ...(record.sources || [])]);
    }

    load();
  </script>
</body>
</html>
