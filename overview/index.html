<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Omni Phi — AI Overview</title><link rel="stylesheet" href="../assets/style.css"><style>body{margin:0;background:#fff;color:#171717;font-family:system-ui,-apple-system,sans-serif}.shell{width:min(1080px,94vw);margin:auto;padding:24px 0 70px}.kicker{font-size:12px;font-weight:950;letter-spacing:.14em;color:#6c34a6;text-transform:uppercase}h1{font-size:clamp(34px,7vw,62px);margin:8px 0}.overview{border:2px solid #9c6ade;border-radius:24px;background:#fbf7ff;padding:22px;margin:20px 0}.overview p{line-height:1.7}.orange-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.orange{overflow:hidden;border:2px solid #fb923c;border-radius:21px;background:linear-gradient(145deg,#f97316,#c2410c);color:#fff}.orange img{width:100%;aspect-ratio:16/10;object-fit:cover}.copy{padding:15px}.copy h3{margin:0 0 8px;color:#fff7ed}.copy p{color:#fff7ed;line-height:1.55}.actions{display:flex;gap:8px}.actions button{border:1px solid #ffffff66;border-radius:11px;padding:9px 11px;background:#7c2d12;color:#fff;font-weight:900}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.nav a{padding:11px 13px;border-radius:13px;background:#f7f3fb;color:#49216e;text-decoration:none;font-weight:850}.status{color:#666;padding:14px 0}</style></head><body><main class="shell"><div class="kicker">Omni Phi · AI Overview</div><h1 id="title">Building the overview…</h1><section class="overview"><div class="kicker">AI Overview</div><div id="overview" class="status">Understanding the subject…</div></section><section><div class="kicker">Orange stories</div><h2>What is actually going on</h2><p>Cards only appear when Omni has enough indexed material to explain the image or subject meaningfully.</p><div id="orangeGrid" class="orange-grid"><div class="status">Researching stories…</div></div></section><nav class="nav"><a id="images">Images</a><a id="stories">Full Stories</a><a id="index">Website Index</a></nav></main><script src="../assets/omni-family.js"></script><script src="../assets/indexer.js"></script><script src="../assets/app.js"></script><script src="../assets/smart-search.js"></script><script src="../assets/multi-source-search.js?v=20260917-storygate1"></script><script>(()=>{'use strict';const p=new URLSearchParams(location.search),q=(p.get('q')||'').trim(),mode=p.get('mode')||'search',grid=document.getElementById('orangeGrid'),esc=v=>OmniPhi.escapeHtml(String(v||'')),IMAGE_KEY='phiShared:imageSelections:v1';document.getElementById('title').textContent=q||'Omni Phi AI Overview';const qp=new URLSearchParams({q,mode});document.getElementById('images').href=`${OmniPhi.url('images/')}?${qp}`;document.getElementById('stories').href=`${OmniPhi.url('structured/')}?${qp}`;document.getElementById('index').href=`${OmniPhi.url('cards/')}?${qp}`;function selectedImages(){try{return(JSON.parse(localStorage.getItem(IMAGE_KEY))||[]).filter(x=>String(x.searchQuery||'').toLowerCase()===q.toLowerCase())}catch{return[]}}function valid(s){const story=String(s.aiCardText||s.sourceExtract||s.extract||'').replace(/\s+/g,' ').trim();return story.length>=100&&Boolean(s.url||s.sourceUrl)}function story(s){return String(s.aiCardText||s.sourceExtract||s.extract||'').replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s+/).filter(Boolean).slice(0,4).join(' ').slice(0,760)}function title(s,i){return String(s.aiCardTitle||s.sourceTitle||s.title||`${q} story ${i+1}`).trim()}function collect(s){OmniPhi.collectSource?.(s)}async function share(s){try{const text=`${title(s,0)}\n\n${story(s)}`;if(navigator.share)await navigator.share({title:title(s,0),text,url:location.href});else await navigator.clipboard.writeText(`${text}\n${location.href}`)}catch{}}function mergeSelected(sources){const picks=selectedImages().filter(valid);if(!picks.length)return sources;const keys=new Set(picks.map(x=>x.sourceUrl||x.url||x.image));return[...picks,...sources.filter(x=>!keys.has(x.url||x.sourceUrl||x.image))]}function render(record){const sources=mergeSelected(record.sources||[]).filter(valid).slice(0,15);document.getElementById('overview').className='';document.getElementById('overview').innerHTML=`<p>${esc(record.overview||`Omni Phi found ${sources.length} evidence-backed story directions for ${q}.`)}</p>`;if(!sources.length){grid.innerHTML='<div class="status">Omni did not find enough indexed meaning to make an honest orange story card yet. Try Images or refine the search; it will not manufacture an empty card.</div>';return}grid.innerHTML=sources.map((s,i)=>`<article class="orange">${s.image?`<img src="${esc(s.image)}" alt="${esc(title(s,i))}" loading="lazy">`:''}<div class="copy"><h3>${esc(title(s,i))}</h3><p>${esc(story(s))}</p><div class="actions"><button data-c="${i}">Collect</button><button data-s="${i}">Share</button></div></div></article>`).join('');grid.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>collect(sources[+b.dataset.c]));grid.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>share(sources[+b.dataset.s]))}async function load(){if(!q)return;let sources=[];try{sources=await OmniPhi.fetchAllSources(q)}catch(e){console.warn(e)}sources=sources.filter(valid);const record=OmniPhi.createResearch(q,mode,sources);render(record)}load()})();</script></body></html>
