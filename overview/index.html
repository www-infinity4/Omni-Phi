<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Omni Phi — AI Overview</title><link rel="stylesheet" href="../assets/style.css"><style>html{scroll-behavior:smooth}body{margin:0;background:#fff;color:#171717;font-family:system-ui,-apple-system,sans-serif}.shell{width:min(1080px,94vw);margin:auto;padding:24px 0 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.menuBtn{border:0;border-radius:14px;background:#17863c;color:#fff;font-size:24px;padding:8px 13px}.kicker{font-size:12px;font-weight:950;letter-spacing:.14em;color:#6c34a6;text-transform:uppercase}h1{font-size:clamp(34px,7vw,62px);margin:8px 0}.overview{border:2px solid #9c6ade;border-radius:24px;background:#fbf7ff;padding:22px;margin:20px 0}.overview p{line-height:1.7}.category{scroll-margin-top:20px;margin:30px 0}.category h2{margin-bottom:5px}.orange-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.orange{overflow:hidden;border:2px solid #fb923c;border-radius:21px;background:linear-gradient(145deg,#f97316,#c2410c);color:#fff}.orange img{width:100%;aspect-ratio:16/10;object-fit:cover}.copy{padding:15px}.copy h3{margin:0 0 8px;color:#fff7ed}.copy p{color:#fff7ed;line-height:1.58;white-space:normal}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #ffffff66;border-radius:11px;padding:9px 11px;background:#7c2d12;color:#fff;font-weight:900;font-size:13px}.actions button.done{background:#14532d}.sources{margin-top:42px;border-top:1px solid #ddd;padding-top:15px;color:#666;font-size:12px}.viewer{position:fixed;inset:0;background:#fff;z-index:30;display:none;flex-direction:column}.viewer.open{display:flex}.viewer header{padding:10px;display:flex;justify-content:space-between;border-bottom:1px solid #ddd}.viewer iframe{border:0;flex:1;width:100%}.drawer{position:fixed;z-index:40;top:0;right:-340px;width:min(320px,88vw);height:100vh;background:#fff;box-shadow:-10px 0 35px #0003;padding:20px;transition:.2s;overflow:auto}.drawer.open{right:0}.drawer a{display:block;padding:12px;margin:5px 0;border-radius:12px;background:#f5edfc;color:#4e2275;text-decoration:none;font-weight:850}.drawer h4{margin:18px 0 6px;color:#666}.status{color:#666;padding:14px 0}</style></head><body><aside class="drawer" id="drawer"><button id="closeMenu">Close</button><h3>Explore this subject</h3><div id="categoryLinks"></div><h4>Phi tools</h4><a id="images">Images</a><a id="stories">Full Stories</a><a id="index">Website Index</a></aside><main class="shell"><div class="top"><div class="kicker">Omni Phi · AI Overview</div><button class="menuBtn" id="menu">☰</button></div><h1 id="title">Building the overview…</h1><section class="overview"><div class="kicker">AI Overview</div><div id="overview" class="status">Understanding the subject…</div></section><div id="storySections"><div class="status">Researching and categorizing every selected image…</div></div><section class="sources"><b>Source credits</b><div id="sourceCredits"></div></section></main><div class="viewer" id="viewer"><header><b id="viewerTitle">Source</b><button id="closeViewer">Close</button></header><iframe id="sourceFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe></div><script src="../assets/omni-family.js"></script><script src="../assets/indexer.js"></script><script src="../assets/app.js"></script><script src="../assets/smart-search.js"></script><script src="../assets/multi-source-search.js?v=20260917-taxonomy2"></script><script src="../assets/card-pipeline.js?v=20260917-taxonomy2"></script><script>(()=>{'use strict';const p=new URLSearchParams(location.search),q=(p.get('q')||'').trim(),mode=p.get('mode')||'search',root=document.getElementById('storySections'),esc=v=>OmniPhi.escapeHtml(String(v||'')),KEY='omniPhi:imageSelections:v1';title.textContent=q||'Omni Phi AI Overview';const qp=new URLSearchParams({q,mode});images.href=`${OmniPhi.url('images/')}?${qp}`;stories.href=`${OmniPhi.url('structured/')}?${qp}`;index.href=`${OmniPhi.url('cards/')}?${qp}`;menu.onclick=()=>drawer.classList.add('open');closeMenu.onclick=()=>drawer.classList.remove('open');closeViewer.onclick=()=>{viewer.classList.remove('open');sourceFrame.src='about:blank'};function selected(){let all=[];for(const store of [localStorage,sessionStorage]){try{const v=JSON.parse(store.getItem(KEY)||'[]');if(Array.isArray(v)&&v.length){all=v;break}}catch{}}const needle=q.toLowerCase();return all.filter(x=>{const a=String(x.searchQuery||'').toLowerCase(),b=String(x.selectionScope||'').toLowerCase(),r=String(x.refinedQuery||'').toLowerCase();return a===needle||b===needle||r===needle||a.startsWith(needle+' ')||r.startsWith(needle+' ')})}function raw(s){return String(s.aiCardText||s.sourceExtract||s.extract||s.description||'').replace(/\s+/g,' ').trim()}function story(s){const x=raw(s);if(x.length>=100)return x;const t=String(s.sourceTitle||s.title||q).trim();return `${t} is one visual direction in this ${q} collection. Omni keeps the image connected to its available context so the subject can be explored aesthetically and as research. This direction can be expanded into its history, use, design, science, culture, or other evidence discovered around the image rather than reducing it to a generic picture.`}function ct(s){const text=`${s.sourceTitle||s.title||''} ${raw(s)}`.toLowerCase(),rules=[['Nutrition & Health',/nutrition|nutrient|vitamin|mineral|calorie|health|hydration|lycopene|antioxid|diet|protein|carbohydrate|fiber/],['Vintage Ephemera & Advertising',/vintage|ephemera|catalog|advertis|poster|print|illustrat|193\d|194\d|195\d|seed company|trade catalog/],['Varieties & Seeds',/variet|cultivar|seed|heirloom|hybrid|germinat|breeding/],['Growing & Gardening',/grow|garden|plant|soil|harvest|farm|crop|cultivat|irrigat|vine/],['Science & Botany',/science|botan|biology|research|study|genetic|species|citrullus|experiment|plant anatomy/],['History & Origins',/history|historic|origin|ancient|century|introduced|archive|heritage/],['Food & Recipes',/food|cook|recipe|eat|flavor|kitchen|dish|salad|juice|dessert/],['Art & Design',/art|design|graphic|photograph|painting|visual|aesthetic|illustrat/],['Culture & People',/culture|festival|people|tradition|social|community|symbol|celebrat/],['Business & Agriculture',/business|industry|production|commercial|trade|sale|economic|supply|market|agriculture/]];return(rules.find(r=>r[1].test(text))||['More discoveries'])[0]}function score(s){const x=raw(s).toLowerCase();return Math.min(6,x.length/220)+(s.image?2:0)+(s.url||s.sourceUrl?1:0)+(/history|nutrition|vintage|catalog|science|how|why|variet|culture|recipe|garden/.test(x)?2:0)}function rec(s,i){return{...s,title:String(s.aiCardTitle||s.sourceTitle||s.title||`${q} story ${i+1}`).trim(),extract:story(s),image:s.image||s.imageUrl||'',url:s.url||s.sourceUrl||'',sourceUrl:s.sourceUrl||s.url||'',storyKey:s.storyKey||s.url||s.sourceUrl||`${q}-${i}` ,kind:'orange-story',previewTone:'orange',category:ct(s)}}function collect(c,b){OmniPhi.collectSource(c);b.classList.add('done');b.textContent='Collected ✓';b.disabled=true}async function share(c,b){b.textContent='Sharing…';const r=await OmniPhi.shareCard(c);if(r?.cancelled||r?.error){b.textContent='Share · 1/10 ★';return}b.classList.add('done');b.textContent=r?.awarded?'Shared · +1/10 ★':'Shared ✓'}function starter(c){OmniPhi.collectSource(c);const u=new URL('../cards/',location.href);u.searchParams.set('q',q);u.searchParams.set('starter',c.storyKey);location.assign(u.href)}function openSource(c){const u=c.sourceUrl||c.url;if(!u)return;viewerTitle.textContent=c.title;sourceFrame.src=u;viewer.classList.add('open')}const sectionMap=new Map(),sectionCounts=new Map();let renderedCards=[];function ensureSection(name){if(sectionMap.has(name))return sectionMap.get(name);const id=`cat-${sectionMap.size}`;categoryLinks.insertAdjacentHTML('beforeend',`<a href="#${id}" data-jump="${esc(name)}">${esc(name)} <small data-nav-count="${esc(name)}">(0)</small></a>`);const sec=document.createElement('section');sec.className='category';sec.id=id;sec.innerHTML=`<div class="kicker">${esc(name)}</div><h2>${esc(name)}</h2><div class="orange-grid"></div>`;root.appendChild(sec);sectionMap.set(name,sec);sectionCounts.set(name,0);const jump=categoryLinks.querySelector(`[data-jump="${CSS.escape(name)}"]`);if(jump)jump.onclick=()=>drawer.classList.remove('open');return sec}function appendCard(source,index){const c=rec(source,index),sec=ensureSection(c.category),grid=sec.querySelector('.orange-grid'),article=document.createElement('article');article.className='orange';article.innerHTML=`${c.image?`<img src="${esc(c.image)}" alt="${esc(c.title)}" loading="lazy">`:''}<div class="copy"><h3>${esc(c.title)}</h3><p>${esc(c.extract)}</p><div class="actions"><button data-c>Collect</button><button data-s>Share · 1/10 ★</button><button data-b>Build from card →</button></div></div>`;article.querySelector('[data-c]').onclick=e=>collect(c,e.currentTarget);article.querySelector('[data-s]').onclick=e=>share(c,e.currentTarget);article.querySelector('[data-b]').onclick=()=>starter(c);grid.appendChild(article);renderedCards.push(c);const n=(sectionCounts.get(c.category)||0)+1;sectionCounts.set(c.category,n);const nav=categoryLinks.querySelector(`[data-nav-count="${CSS.escape(c.category)}"]`);if(nav)nav.textContent=`(${n})`;if(c.sourceUrl||c.url){const row=document.createElement('div'),b=document.createElement('button');b.style.cssText='border:0;background:none;color:#5d3975;text-decoration:underline;font:inherit';b.textContent=c.title;b.onclick=()=>openSource(c);row.appendChild(b);sourceCredits.appendChild(row)}}function setProgress(done,total){const el=document.getElementById('cardProgress');if(!el)return;el.textContent=done>=total?`${done} story cards ready.`:`Creating story cards one at a time… ${done} of ${total}`}async function load(){if(!q)return;const picks=selected();let fetched=[];try{fetched=window.OmniMultiSourceSearch?.searchRaw?await OmniMultiSourceSearch.searchRaw(q):await OmniPhi.fetchAllSources(q)}catch{}const enriched=picks.map(x=>{const hit=fetched.find(f=>(x.image&&f.image===x.image)||(f.url&&(f.url===x.url||f.url===x.sourceUrl)));return{...(hit||{}),...x,sourceExtract:x.sourceExtract||x.extract||hit?.sourceExtract||hit?.extract||'',extract:x.extract||x.sourceExtract||hit?.extract||hit?.sourceExtract||''}});const keys=new Set(enriched.map(x=>x.image||x.url||x.sourceUrl));const all=[...enriched,...fetched.filter(x=>!keys.has(x.image||x.url||x.sourceUrl))];const collected=(()=>{try{return OmniPhi.profile()?.collected||[]}catch{return[]}})();const expanded=[...all,...collected.filter(x=>!keys.has(x.image||x.url||x.sourceUrl))];const ordered=expanded.map((x,i)=>({source:x,score:score(rec(x,i))})).sort((a,b)=>b.score-a.score).map(x=>x.source);const research=OmniPhi.createResearch(q,mode,ordered);const intent=OmniSmartSearch.resolveIntent(q);overview.className='status';overview.textContent='Writing the AI Overview first…';root.innerHTML='<div class="status" id="cardProgress">Story cards will appear here after the overview.</div>';categoryLinks.innerHTML='';sourceCredits.innerHTML='';let overviewText=research?.overview||'';if(window.OmniSmartSearch?.generateOverviewWithAi){overviewText=await OmniSmartSearch.generateOverviewWithAi(q,intent,ordered)}overview.className='';overview.innerHTML=`<p>${esc(overviewText)}</p>`;if(research){research.overview=overviewText;OmniPhi.saveResearch(research)}setProgress(0,ordered.length);let done=0;for(let i=0;i<ordered.length;i+=1){let made=ordered[i];if(window.OmniSmartSearch?.enrichOneCardWithAi){made=await OmniSmartSearch.enrichOneCardWithAi(q,intent,ordered[i])}if(made)appendCard(made,i);done+=1;setProgress(done,ordered.length);await new Promise(resolve=>setTimeout(resolve,60))}}load()})();</script></body></html>
