<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Omni Phi — Image Results</title><meta name="theme-color" content="#07071c"><link rel="stylesheet" href="../assets/style.css"><style>
body{background:#07071c;color:#fff}.image-shell{width:min(1240px,96vw);margin:auto;padding:18px 0 48px}.image-nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px;background:rgba(7,7,28,.95);backdrop-filter:blur(12px);border-bottom:1px solid #49326d}.image-nav.bottom{position:static;margin-top:22px;border:1px solid #49326d;border-radius:18px}.image-nav button,.image-nav a,.refine button{min-height:44px;padding:10px 13px;border:1px solid #ffd85b;border-radius:14px;background:#30104c;color:#fff5a2;font-weight:850;text-decoration:none}.image-head{padding:20px 6px 10px}.image-head small{color:#ffd95a;font-weight:900;letter-spacing:.14em}.image-head h1{margin:.45rem 0;font-size:clamp(1.6rem,6vw,3rem)}.image-head p{color:#cfc8ef;line-height:1.55}.refine{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:8px 4px 18px}.refine input{min-height:48px;border:1px solid #7255a6;border-radius:14px;padding:0 14px;background:#12102a;color:#fff;font-size:1rem}.chips{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}.chips button{min-height:36px;padding:7px 10px;border-color:#5e4b8a;color:#ddd;background:#17132e;font-size:.8rem}.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.photo{position:relative;min-height:170px;border:2px solid transparent;border-radius:16px;overflow:hidden;background:#141126;cursor:pointer}.photo img{width:100%;height:180px;object-fit:cover;display:block}.photo .caption{padding:8px;font-size:.76rem;line-height:1.25;color:#ddd}.photo .provider{display:block;color:#9f91c9;font-size:.66rem;margin-top:3px}.photo.selected{border-color:#ffe04c;box-shadow:0 0 0 2px rgba(255,224,76,.22)}.photo.selected:after{content:'✓';position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffe04c;color:#160d00;font-weight:1000}.status{grid-column:1/-1;padding:24px;text-align:center;color:#d7ceef}.selected-count{font-weight:900;color:#ffe04c}.more{display:block;width:min(420px,92%);margin:22px auto 0;min-height:54px;border:1px solid #ffe04c;border-radius:16px;background:#41115d;color:#fff5a2;font-weight:950;font-size:1rem}@media(min-width:760px){.photo img{height:220px}.image-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
</style></head><body><div id="topbar"></div><main class="image-shell"><div class="image-nav"><button data-back>← Build cards from selected</button><span class="selected-count" data-count>0 selected</span><a id="googleTop" target="_blank" rel="noopener">Google Images ↗</a></div><header class="image-head"><small>IMAGE RESULTS · VISUAL RESEARCH</small><h1 id="title">Image results</h1><p>Choose the actual images you want to drive the orange cards. Search broadly, refine with extra keywords, then load more continuously.</p></header><form class="refine" id="refine"><input id="refineInput" aria-label="Refine image search" placeholder="Add keywords — cartoons, Mickey, animation, films…"><button type="submit">Refine images</button><div class="chips" id="chips"></div></form><section class="image-grid" id="grid"><div class="status">Loading broad image results…</div></section><button class="more" id="more" type="button">Load more images ↓</button><div class="image-nav bottom"><button data-back>← Build cards from selected</button><span class="selected-count" data-count>0 selected</span><a id="googleBottom" target="_blank" rel="noopener">Google Images ↗</a></div></main><script src="../assets/omni-family.js"></script><script>
(()=>{'use strict';const p=new URLSearchParams(location.search),base=(p.get('q')||'').trim(),extra=(p.get('refine')||'').trim(),grid=document.getElementById('grid'),KEY='phiShared:imageSelections:v1';let page=0,busy=false,seen=new Set();const query=()=>[base,extra].filter(Boolean).join(' ').trim();document.getElementById('title').textContent=`Photos for ${query()||'your search'}`;if(window.OmniPhi){document.getElementById('topbar').innerHTML=OmniPhi.topbar('OMNI PHI','Images');OmniPhi.setupMenu?.()}document.getElementById('refineInput').value=extra;
const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},write=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch{}},key=x=>x.image||x.imageUrl||x.url||x.id;function selected(){return read().filter(x=>String(x.searchQuery||'').toLowerCase()===base.toLowerCase())}function count(){document.querySelectorAll('[data-count]').forEach(x=>x.textContent=`${selected().length} selected`)}function toggle(item,card){let all=read(),k=key(item),i=all.findIndex(x=>key(x)===k&&String(x.searchQuery||'').toLowerCase()===base.toLowerCase());if(i>=0){all.splice(i,1);card.classList.remove('selected')}else{all.push({...item,searchQuery:base,refinedQuery:query(),selectedFromImageSearch:true,collectedAt:new Date().toISOString(),kind:'image-seed'});card.classList.add('selected')}write(all.slice(-500));count()}
function googleUrl(){return `https://www.google.com/search?tbm=isch&hl=en&safe=active&q=${encodeURIComponent(query())}`}function links(){document.getElementById('googleTop').href=googleUrl();document.getElementById('googleBottom').href=googleUrl()}links();function back(){location.href=`${OmniPhi.url('overview/')}?${new URLSearchParams({q:base,mode:'search',images:'selected'})}#visual-pattern`}document.querySelectorAll('[data-back]').forEach(b=>b.onclick=back);count();
document.getElementById('refine').onsubmit=e=>{e.preventDefault();let r=document.getElementById('refineInput').value.trim(),u=new URL(location.href);r?u.searchParams.set('refine',r):u.searchParams.delete('refine');location.href=u};const chipWords=['cartoons','characters','animation','Mickey Mouse','classic films','Disneyland','concept art','posters'];document.getElementById('chips').innerHTML=chipWords.map(x=>`<button type="button" data-chip="${x}">+ ${x}</button>`).join('');document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{document.getElementById('refineInput').value=[extra,b.dataset.chip].filter(Boolean).join(' ');document.getElementById('refine').requestSubmit()});
async function googleImages(q){try{let r=await fetch(`https://r.jina.ai/${`https://www.google.com/search?tbm=isch&hl=en&safe=active&q=${encodeURIComponent(q)}`}`,{cache:'no-store'});if(!r.ok)return[];let t=await r.text(),out=[];for(const m of t.matchAll(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/g)){let u=m[2];if(!/\.(?:jpe?g|png|webp)(?:\?|$)/i.test(u)||/logo|icon|favicon|sprite|avatar|emoji|badge|pixel/i.test(u))continue;out.push({image:u,imageUrl:u,title:(m[1]||q).slice(0,220),sourceUrl:googleUrl(),provider:'Google Images',origin:'google-images'});if(out.length>=80)break}return out}catch{return[]}}
async function commons(q,offset){try{let u=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=50&gsroffset=${offset}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=900&format=json&origin=*`,r=await fetch(u),j=await r.json();return Object.values(j.query?.pages||{}).map(x=>({image:x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url,title:(x.title||'').replace(/^File:/,''),sourceUrl:x.imageinfo?.[0]?.descriptionurl||'',provider:'Wikimedia Commons',origin:'commons'})).filter(x=>x.image)}catch{return[]}}
async function openverse(q,pageNo){try{let r=await fetch(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=50&page=${pageNo+1}`),j=await r.json();return (j.results||[]).map(x=>({image:x.thumbnail||x.url,title:x.title||q,sourceUrl:x.foreign_landing_url||x.detail_url||'',provider:x.source||'Openverse',origin:'openverse'})).filter(x=>x.image)}catch{return[]}}
function variants(){let q=query(),low=q.toLowerCase(),v=[q];if(/disney/.test(low)){v.push(`${q} animated characters`,`${q} cartoons Mickey Minnie Donald Goofy`,`${q} animation films characters`,`${q} classic Disney cartoons`,`${q} movie art posters`)}return [...new Set(v)]}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function append(items){let chosen=new Set(selected().map(key));items.forEach(item=>{if(!item.image||seen.has(item.image))return;seen.add(item.image);let c=document.createElement('article');c.className='photo'+(chosen.has(key(item))?' selected':'');c.innerHTML=`<img loading="lazy" alt="${esc(item.title||query())}"><div class="caption">${esc(item.title||query())}<span class="provider">${esc(item.provider||'image source')}</span></div>`;c.querySelector('img').src=item.image;c.onclick=()=>toggle(item,c);grid.appendChild(c)})}
async function load(){if(busy)return;busy=true;document.getElementById('more').textContent='Finding more images…';if(page===0)grid.innerHTML='';let vv=variants(),tasks=[commons(vv[page%vv.length],page*50),openverse(vv[page%vv.length],page)];if(page<vv.length)tasks.unshift(googleImages(vv[page]));let groups=await Promise.all(tasks);append(groups.flat());page++;busy=false;document.getElementById('more').textContent='Load more images ↓';if(!grid.children.length)grid.innerHTML='<div class="status">No inline images yet. Refine the query or open the full Google Images result set.</div>'}document.getElementById('more').onclick=load;load();})();
</script></body></html>
