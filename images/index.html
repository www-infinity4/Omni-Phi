<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Omni Phi — Image Results</title><link rel="stylesheet" href="../assets/style.css"><style>body{margin:0;background:#fff;color:#171717;font-family:system-ui,-apple-system,sans-serif}.image-shell{width:min(1240px,96vw);margin:auto;padding:18px 0 48px}.image-nav{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px;position:sticky;top:0;z-index:10;background:#fffffff2}.image-nav button,.image-nav a,.refine button{min-height:44px;padding:10px 13px;border:1px solid #9c6ade;border-radius:14px;background:#f5edfc;color:#4e2275;font-weight:850;text-decoration:none}.image-head{padding:20px 6px}.refine{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:18px}.refine input{min-height:48px;border:1px solid #aaa;border-radius:14px;padding:0 14px}.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:11px}.photo{position:relative;border:2px solid transparent;border-radius:16px;overflow:hidden;background:#f6f4f8;cursor:pointer;touch-action:manipulation}.photo img{width:100%;height:210px;object-fit:cover;display:block;pointer-events:none}.caption{padding:9px;font-size:.78rem;pointer-events:none}.context{display:block;color:#666;font-size:.68rem;margin-top:4px;line-height:1.35}.photo.selected{border-color:#8a42c2;box-shadow:0 0 0 2px #8a42c233}.photo.selected:after{content:'✓';position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#8a42c2;color:#fff;font-weight:1000}.more{display:block;margin:22px auto;padding:14px 28px;border:1px solid #9c6ade;border-radius:14px;background:#f5edfc;font-weight:900}.notice{grid-column:1/-1;padding:20px}</style></head><body><main class="image-shell"><div class="image-nav"><button data-build>Build stories from selected →</button><b data-count>0 selected</b><a id="google" target="_blank" rel="noopener">Google Images ↗</a></div><header class="image-head"><small>IMAGE RESULTS</small><h1 id="title">Images</h1><p>Select the visual world you want. Phi keeps source context when it exists and researches the meaning after selection instead of hiding useful images just because their first source record is thin.</p></header><form class="refine" id="refine"><input id="refineInput" placeholder="Refine the subject or visual meaning"><button>Refine images</button></form><section class="image-grid" id="grid"><div class="notice">Finding images…</div></section><button class="more" id="more">Load more images ↓</button></main><script src="../assets/app.js"></script><script src="../assets/smart-search.js"></script><script src="../assets/multi-source-search.js?v=20260917-image-broad2"></script><script>(()=>{'use strict';const p=new URLSearchParams(location.search),base=(p.get('q')||'').trim(),extra=(p.get('refine')||'').trim(),q=()=>[base,extra].filter(Boolean).join(' ').trim(),grid=document.getElementById('grid'),KEY='phiShared:imageSelections:v1';let page=0,busy=false,seen=new Set(),indexed=[];const esc=s=>OmniPhi.escapeHtml(String(s||'')),read=()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}},write=v=>{try{localStorage.setItem(KEY,JSON.stringify(v));return true}catch(e){console.error('image selection save failed',e);return false}},key=x=>x.image||x.imageUrl||x.sourceUrl||x.url||x.id;document.getElementById('title').textContent=`Images for ${q()||'your search'}`;document.getElementById('refineInput').value=extra;document.getElementById('google').href=`https://www.google.com/search?tbm=isch&hl=en&safe=active&q=${encodeURIComponent(q())}`;function selected(){return read().filter(x=>String(x.searchQuery||'').toLowerCase()===base.toLowerCase())}function count(){document.querySelectorAll('[data-count]').forEach(x=>x.textContent=`${selected().length} selected`)}function toggle(item,c){const a=read(),k=key(item),i=a.findIndex(x=>key(x)===k&&String(x.searchQuery||'').toLowerCase()===base.toLowerCase());if(i>=0){a.splice(i,1);if(write(a)){c.classList.remove('selected')}}else{const saved={...item,searchQuery:base,refinedQuery:q(),selectedFromImageSearch:true,kind:'image-evidence',collectedAt:new Date().toISOString()};a.push(saved);if(write(a.slice(-500))){c.classList.add('selected')}}count()}function build(){const picks=selected();if(!picks.length)return alert('Select at least one image first.');const u=new URL('../overview/',location.href);u.searchParams.set('q',base);u.searchParams.set('images','selected');location.assign(u.href)}document.querySelectorAll('[data-build]').forEach(b=>b.onclick=build);count();document.getElementById('refine').onsubmit=e=>{e.preventDefault();const u=new URL(location.href),v=document.getElementById('refineInput').value.trim();v?u.searchParams.set('refine',v):u.searchParams.delete('refine');location.assign(u.href)};function normalizeSource(s){return{image:s.image||s.imageUrl||'',title:s.title||q(),sourceTitle:s.title||q(),sourceUrl:s.url||s.sourceUrl||'',url:s.url||s.sourceUrl||'',sourceExtract:s.sourceExtract||s.extract||'',extract:s.sourceExtract||s.extract||'',provider:s.provider||s.domain||'Indexed web',domain:s.domain||''}}async function commons(term,offset){try{const u=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(term)}&gsrnamespace=6&gsrlimit=50&gsroffset=${offset}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=900&format=json&origin=*`,r=await fetch(u),j=await r.json();return Object.values(j.query?.pages||{}).map(x=>{const m=x.imageinfo?.[0]?.extmetadata||{},desc=String(m.ImageDescription?.value||m.ObjectName?.value||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();return{image:x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url,title:(x.title||'').replace(/^File:/,''),sourceTitle:(x.title||'').replace(/^File:/,''),sourceUrl:x.imageinfo?.[0]?.descriptionurl||'',url:x.imageinfo?.[0]?.descriptionurl||'',sourceExtract:desc,extract:desc,provider:'Wikimedia Commons',domain:'commons.wikimedia.org'}}).filter(x=>x.image)}catch{return[]}}function append(items){const chosen=new Set(selected().map(key));let n=0;for(const item of items){if(!item.image||seen.has(item.image))continue;seen.add(item.image);n++;const c=document.createElement('article');c.className='photo'+(chosen.has(key(item))?' selected':'');const context=String(item.sourceExtract||item.extract||'').trim();c.innerHTML=`<img loading="lazy" src="${esc(item.image)}" alt="${esc(item.title||q())}"><div class="caption"><b>${esc(item.title||q())}</b>${context?`<span class="context">${esc(context.slice(0,180))}</span>`:'<span class="context">Select to research this visual direction</span>'}</div>`;c.querySelector('img').onerror=()=>c.remove();c.addEventListener('click',()=>toggle(item,c));grid.appendChild(c)}return n}async function load(){if(busy)return;busy=true;if(page===0){grid.innerHTML='';try{indexed=(await OmniPhi.fetchAllSources(q())).filter(s=>s.image||s.imageUrl).map(normalizeSource)}catch{indexed=[]}}const commonsItems=await commons(q(),page*50),combined=page===0?[...indexed,...commonsItems]:commonsItems,added=append(combined);if(!seen.size)grid.innerHTML='<div class="notice">No images returned yet. Try refining the search.</div>';page++;busy=false;document.getElementById('more').textContent=added?'Load more images ↓':'Try more images ↓'}document.getElementById('more').onclick=load;load()})();</script></body></html>
