<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Omni Phi — Image Results</title><meta name="theme-color" content="#07071c"><link rel="stylesheet" href="../assets/style.css"><style>body{background:#07071c;color:#fff}.image-shell{width:min(1240px,96vw);margin:auto;padding:18px 0 48px}.image-nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px;background:rgba(7,7,28,.95);border-bottom:1px solid #49326d}.image-nav.bottom{position:static;margin-top:22px;border:1px solid #49326d;border-radius:18px}.image-nav button,.image-nav a,.refine button{min-height:44px;padding:10px 13px;border:1px solid #ffd85b;border-radius:14px;background:#30104c;color:#fff5a2;font-weight:850;text-decoration:none}.image-head{padding:20px 6px 10px}.image-head small{color:#ffd95a;font-weight:900}.image-head p{color:#cfc8ef}.refine{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:8px 4px 18px}.refine input{min-height:48px;border:1px solid #7255a6;border-radius:14px;padding:0 14px;background:#12102a;color:#fff}.chips{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}.chips button{min-height:36px;padding:7px 10px;background:#17132e}.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.photo{position:relative;border:2px solid transparent;border-radius:16px;overflow:hidden;background:#141126;cursor:pointer}.photo img{width:100%;height:180px;object-fit:cover;display:block}.caption{padding:8px;font-size:.76rem;color:#ddd}.provider{display:block;color:#9f91c9;font-size:.66rem}.photo.selected{border-color:#ffe04c}.photo.selected:after{content:'✓';position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffe04c;color:#160d00;font-weight:1000}.selected-count{font-weight:900;color:#ffe04c}.more{display:block;width:min(420px,92%);margin:22px auto 0;min-height:54px;border:1px solid #ffe04c;border-radius:16px;background:#41115d;color:#fff5a2;font-weight:950}@media(min-width:760px){.photo img{height:220px}.image-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}</style></head><body><div id="topbar"></div><main class="image-shell"><div class="image-nav"><button data-build>Build cards from selected →</button><span class="selected-count" data-count>0 selected</span><a id="googleTop" target="_blank" rel="noopener">Google Images ↗</a></div><header class="image-head"><small>IMAGE RESULTS · VISUAL RESEARCH</small><h1 id="title">Image results</h1><p>Choose images, refine the search, load more, then build the AI Overview directly from those selections.</p></header><form class="refine" id="refine"><input id="refineInput" placeholder="Add keywords — species, butterflies, cartoons, films…"><button>Refine images</button><div class="chips" id="chips"></div></form><section class="image-grid" id="grid">Loading images…</section><button class="more" id="more">Load more images ↓</button><div class="image-nav bottom"><button data-build>Build cards from selected →</button><span class="selected-count" data-count>0 selected</span><a id="googleBottom" target="_blank" rel="noopener">Google Images ↗</a></div></main><script src="../assets/omni-family.js"></script><script>(()=>{'use strict';const p=new URLSearchParams(location.search),base=(p.get('q')||'').trim(),extra=(p.get('refine')||'').trim(),grid=document.getElementById('grid'),KEY='phiShared:imageSelections:v1';let page=0,busy=false,seen=new Set();const query=()=>[base,extra].filter(Boolean).join(' ').trim();document.getElementById('title').textContent=`Photos for ${query()||'your search'}`;if(window.OmniPhi){document.getElementById('topbar').innerHTML=OmniPhi.topbar('OMNI PHI','Images');OmniPhi.setupMenu?.()}document.getElementById('refineInput').value=extra;const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},write=v=>localStorage.setItem(KEY,JSON.stringify(v)),key=x=>x.image||x.imageUrl||x.url||x.id;function selected(){return read().filter(x=>String(x.searchQuery||'').toLowerCase()===base.toLowerCase())}function count(){document.querySelectorAll('[data-count]').forEach(x=>x.textContent=`${selected().length} selected`)}function toggle(item,card){let all=read(),k=key(item),i=all.findIndex(x=>key(x)===k&&String(x.searchQuery||'').toLowerCase()===base.toLowerCase());if(i>=0){all.splice(i,1);card.classList.remove('selected')}else{all.push({...item,searchQuery:base,refinedQuery:query(),selectedFromImageSearch:true,collectedAt:new Date().toISOString(),kind:'image-seed'});card.classList.add('selected')}write(all.slice(-500));count()}function googleUrl(q=query()){return `https://www.google.com/search?tbm=isch&hl=en&safe=active&q=${encodeURIComponent(q)}`}document.getElementById('googleTop').href=googleUrl();document.getElementById('googleBottom').href=googleUrl();function build(){const picks=selected();if(!picks.length){alert('Select at least one image first.');return}sessionStorage.setItem('phiShared:visualBuild:v1',JSON.stringify({query:base,selected:picks.map(key),createdAt:Date.now()}));const u=new URL('../overview/',location.href);u.searchParams.set('q',base);u.searchParams.set('mode','search');u.searchParams.set('images','selected');u.searchParams.set('visualBuild',String(Date.now()));location.assign(u.href+'#visual-pattern')}document.querySelectorAll('[data-build]').forEach(b=>b.addEventListener('click',build));count();document.getElementById('refine').onsubmit=e=>{e.preventDefault();let r=document.getElementById('refineInput').value.trim(),u=new URL(location.href);r?u.searchParams.set('refine',r):u.searchParams.delete('refine');location.assign(u.href)};const chips=['species','butterflies','identification','cartoons','characters','animation','Mickey Mouse','classic films','concept art','posters'];document.getElementById('chips').innerHTML=chips.map(x=>`<button type="button" data-chip="${x}">+ ${x}</button>`).join('');document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{document.getElementById('refineInput').value=[extra,b.dataset.chip].filter(Boolean).join(' ');document.getElementById('refine').requestSubmit()});async function googleImages(q){try{let r=await fetch(`https://r.jina.ai/${googleUrl(q)}`,{cache:'no-store'}),t=await r.text(),out=[];for(const m of t.matchAll(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/g)){let u=m[2];if(!/\.(?:jpe?g|png|webp)(?:\?|$)/i.test(u)||/logo|icon|favicon|sprite|avatar|emoji|badge|pixel/i.test(u))continue;out.push({image:u,imageUrl:u,title:(m[1]||q).slice(0,220),sourceUrl:googleUrl(q),provider:'Google Images',origin:'google-images'});if(out.length>=80)break}return out}catch{return[]}}async function commons(q,offset){try{let u=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=50&gsroffset=${offset}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=900&format=json&origin=*`,r=await fetch(u),j=await r.json();return Object.values(j.query?.pages||{}).map(x=>({image:x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url,title:(x.title||'').replace(/^File:/,''),sourceUrl:x.imageinfo?.[0]?.descriptionurl||'',provider:'Wikimedia Commons',origin:'commons'})).filter(x=>x.image)}catch{return[]}}async function openverse(q,n){try{let r=await fetch(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=50&page=${n+1}`),j=await r.json();return(j.results||[]).map(x=>({image:x.thumbnail||x.url,title:x.title||q,sourceUrl:x.foreign_landing_url||x.detail_url||'',provider:x.source||'Openverse',origin:'openverse'})).filter(x=>x.image)}catch{return[]}}function variants(){let q=query(),v=[q];if(/disney/i.test(q))v.push(`${q} animated characters`,`${q} cartoons Mickey Minnie Donald Goofy`,`${q} animation films characters`);return[...new Set(v)]}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function append(items){let chosen=new Set(selected().map(key));items.forEach(item=>{if(!item.image||seen.has(item.image))return;seen.add(item.image);let c=document.createElement('article');c.className='photo'+(chosen.has(key(item))?' selected':'');c.innerHTML=`<img loading="lazy" alt="${esc(item.title||query())}"><div class="caption">${esc(item.title||query())}<span class="provider">${esc(item.provider||'source')}</span></div>`;c.querySelector('img').src=item.image;c.onclick=()=>toggle(item,c);grid.appendChild(c)})}async function load(){if(busy)return;busy=true;if(page===0)grid.innerHTML='';let v=variants(),q=v[page%v.length],groups=await Promise.all([page<v.length?googleImages(q):Promise.resolve([]),commons(q,page*50),openverse(q,page)]);append(groups.flat());page++;busy=false;document.getElementById('more').textContent='Load more images ↓'}document.getElementById('more').onclick=load;load()})();</script></body></html>
