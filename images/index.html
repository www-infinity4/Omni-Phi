<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Omni Phi — Image Results</title><meta name="theme-color" content="#07071c"><link rel="stylesheet" href="../assets/style.css"><style>
body{background:#07071c;color:#fff}.image-shell{width:min(1180px,96vw);margin:auto;padding:18px 0 48px}.image-nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px;background:rgba(7,7,28,.94);backdrop-filter:blur(12px);border-bottom:1px solid #49326d}.image-nav.bottom{position:static;margin-top:22px;border:1px solid #49326d;border-radius:18px}.image-nav button,.image-nav a{min-height:44px;padding:10px 13px;border:1px solid #ffd85b;border-radius:14px;background:#30104c;color:#fff5a2;font-weight:850;text-decoration:none}.image-head{padding:20px 6px 14px}.image-head small{color:#ffd95a;font-weight:900;letter-spacing:.14em}.image-head h1{margin:.45rem 0;font-size:clamp(1.6rem,6vw,3rem);color:#fff}.image-head p{color:#cfc8ef;line-height:1.55}.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.photo{position:relative;min-height:170px;border:2px solid transparent;border-radius:16px;overflow:hidden;background:#141126;cursor:pointer}.photo img{width:100%;height:180px;object-fit:cover;display:block}.photo .caption{padding:8px;font-size:.76rem;line-height:1.25;color:#ddd}.photo.selected{border-color:#ffe04c;box-shadow:0 0 0 2px rgba(255,224,76,.22)}.photo.selected:after{content:'✓';position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ffe04c;color:#160d00;font-weight:1000}.status{grid-column:1/-1;padding:30px;text-align:center;color:#d7ceef}.selected-count{font-weight:900;color:#ffe04c}@media(min-width:760px){.photo img{height:220px}.image-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
</style></head><body><div id="topbar"></div><main class="image-shell"><div class="image-nav"><button data-back>← AI Overview + orange cards</button><span class="selected-count" data-count>0 selected</span><a id="googleTop" target="_blank" rel="noopener">Google Images ↗</a></div><header class="image-head"><small>IMAGE RESULTS · PHOTO-ONLY MODE</small><h1 id="title">Image results</h1><p>Tap as many photos as you want. This page is intentionally photos only — no story cards. Your choices are saved as visual evidence for the AI Overview and website builder.</p></header><section class="image-grid" id="grid"><div class="status">Loading image results…</div></section><div class="image-nav bottom"><button data-back>← AI Overview + orange cards</button><span class="selected-count" data-count>0 selected</span><a id="googleBottom" target="_blank" rel="noopener">Google Images ↗</a></div></main><script src="../assets/omni-family.js"></script><script>
(()=>{'use strict';const p=new URLSearchParams(location.search),q=(p.get('q')||'').trim(),grid=document.getElementById('grid'),KEY='phiShared:imageSelections:v1';document.getElementById('title').textContent=q?`Photos for ${q}`:'Image results';if(window.OmniPhi){document.getElementById('topbar').innerHTML=OmniPhi.topbar('OMNI PHI','Images');OmniPhi.setupMenu?.()}
const google=`https://www.google.com/search?tbm=isch&hl=en&safe=active&q=${encodeURIComponent(q)}`;document.getElementById('googleTop').href=google;document.getElementById('googleBottom').href=google;const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},write=v=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch{}},key=x=>x.image||x.imageUrl||x.url||x.id;
function selected(){return read().filter(x=>String(x.searchQuery||'').toLowerCase()===q.toLowerCase())}function count(){document.querySelectorAll('[data-count]').forEach(x=>x.textContent=`${selected().length} selected`)}function toggle(item,card){let all=read(),k=key(item),i=all.findIndex(x=>key(x)===k&&String(x.searchQuery||'').toLowerCase()===q.toLowerCase());if(i>=0){all.splice(i,1);card.classList.remove('selected')}else{all.push({...item,searchQuery:q,selectedFromImageSearch:true,collectedAt:new Date().toISOString(),kind:'image-seed'});card.classList.add('selected')}write(all.slice(-400));count()}
function back(){location.href=`${window.OmniPhi?OmniPhi.url('overview/'):'../overview/'}?${new URLSearchParams({q,mode:'search',images:'selected'})}#visual-pattern`}document.querySelectorAll('[data-back]').forEach(b=>b.onclick=back);count();
async function googleImages(){try{let r=await fetch(`https://r.jina.ai/${google}`,{cache:'no-store'});if(!r.ok)return[];let t=await r.text(),out=[],seen=new Set();for(const m of t.matchAll(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)(?:\s+"[^"]*")?\)/g)){let u=m[2];if(!/\.(?:jpe?g|png|webp)(?:\?|$)/i.test(u)||seen.has(u)||/logo|icon|favicon|sprite|avatar|emoji|badge|pixel/i.test(u))continue;seen.add(u);out.push({image:u,imageUrl:u,title:(m[1]||q).slice(0,220),sourceUrl:google,provider:'Google Images',origin:'google-images'});if(out.length>=60)break}return out}catch{return[]}}
async function commons(){try{let u=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=40&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=700&format=json&origin=*`,r=await fetch(u),j=await r.json();return Object.values(j.query?.pages||{}).map(x=>({image:x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url,title:(x.title||'').replace(/^File:/,''),sourceUrl:x.imageinfo?.[0]?.descriptionurl||'',provider:'Wikimedia Commons',origin:'commons'})).filter(x=>x.image)}catch{return[]}}
function render(items){let chosen=new Set(selected().map(key)),seen=new Set();items=items.filter(x=>x.image&&!seen.has(x.image)&&(seen.add(x.image),true));if(!items.length){grid.innerHTML='<div class="status">No inline photos rendered. Use Google Images above for the full Google image result set.</div>';return}grid.innerHTML='';items.forEach(item=>{let c=document.createElement('article');c.className='photo'+(chosen.has(key(item))?' selected':'');c.innerHTML=`<img loading="lazy" alt="${esc(item.title||q)}"><div class="caption">${esc(item.title||q)}</div>`;c.querySelector('img').src=item.image;c.onclick=()=>toggle(item,c);grid.appendChild(c)})}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
Promise.all([googleImages(),commons()]).then(([g,c])=>render([...g,...c]));})();
</script></body></html>
