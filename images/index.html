<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Omni Phi — Image Results</title><meta name="theme-color" content="#ffffff"><link rel="stylesheet" href="../assets/style.css"><style>body{margin:0;background:#fff;color:#171717;font-family:system-ui,-apple-system,sans-serif}.image-shell{width:min(1240px,96vw);margin:auto;padding:18px 0 48px}.image-nav{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px;background:#fffffff2;border-bottom:1px solid #ddd}.image-nav.bottom{position:static;margin-top:22px;border:1px solid #ddd;border-radius:18px}.image-nav button,.image-nav a,.refine button{min-height:44px;padding:10px 13px;border:1px solid #9c6ade;border-radius:14px;background:#f5edfc;color:#4e2275;font-weight:850;text-decoration:none}.image-head{padding:20px 6px 10px}.image-head small{color:#7035a5;font-weight:900}.image-head p{color:#555}.refine{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:8px 4px 18px}.refine input{min-height:48px;border:1px solid #aaa;border-radius:14px;padding:0 14px;background:#fff;color:#111}.chips{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}.chips button{min-height:36px;padding:7px 10px;background:#faf7fd}.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.photo{position:relative;border:2px solid transparent;border-radius:16px;overflow:hidden;background:#f6f4f8;cursor:pointer;box-shadow:0 4px 16px #00000010}.photo img{width:100%;height:180px;object-fit:cover;display:block;background:#eee}.caption{padding:8px;font-size:.76rem;color:#333}.provider{display:block;color:#766780;font-size:.66rem}.photo.selected{border-color:#8a42c2}.photo.selected:after{content:'✓';position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#8a42c2;color:#fff;font-weight:1000}.selected-count{font-weight:900;color:#6b2ca0}.more{display:block;width:min(420px,92%);margin:22px auto 0;min-height:54px;border:1px solid #9c6ade;border-radius:16px;background:#f5edfc;color:#4e2275;font-weight:950}.notice{grid-column:1/-1;padding:22px;border:1px solid #e0d4e8;border-radius:16px;background:#faf8fc;color:#55485c;line-height:1.55}@media(min-width:760px){.photo img{height:220px}.image-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}</style></head><body><main class="image-shell"><div class="image-nav"><button data-build>Build website from selected →</button><span class="selected-count" data-count>0 selected</span><a id="googleTop" target="_blank" rel="noopener">Google Images ↗</a></div><header class="image-head"><small>IMAGE RESULTS · VISUAL DIRECTION</small><h1 id="title">Image results</h1><p>Refine as many times as you want. Results combine broad image sources; select the visuals that should direct the website.</p></header><form class="refine" id="refine"><input id="refineInput" placeholder="Refine — style, subject, era, species, product, place…"><button>Refine images</button><div class="chips" id="chips"></div></form><section class="image-grid" id="grid"><div class="notice">Searching images…</div></section><button class="more" id="more">Load more images ↓</button><div class="image-nav bottom"><button data-build>Build website from selected →</button><span class="selected-count" data-count>0 selected</span><a id="googleBottom" target="_blank" rel="noopener">Google Images ↗</a></div></main><script src="../assets/app.js"></script><script>(()=>{'use strict';const p=new URLSearchParams(location.search),base=(p.get('q')||'').trim(),extra=(p.get('refine')||'').trim(),grid=document.getElementById('grid'),KEY='phiShared:imageSelections:v1';let page=0,busy=false,seen=new Set();const query=()=>[base,extra].filter(Boolean).join(' ').trim();document.getElementById('title').textContent=`Images for ${query()||'your search'}`;document.getElementById('refineInput').value=extra;const read=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}},write=v=>localStorage.setItem(KEY,JSON.stringify(v)),key=x=>x.image||x.imageUrl||x.url||x.id;function selected(){return read().filter(x=>String(x.searchQuery||'').toLowerCase()===base.toLowerCase())}function count(){document.querySelectorAll('[data-count]').forEach(x=>x.textContent=`${selected().length} selected`)}function toggle(item,card){let all=read(),k=key(item),i=all.findIndex(x=>key(x)===k&&String(x.searchQuery||'').toLowerCase()===base.toLowerCase());if(i>=0){all.splice(i,1);card.classList.remove('selected')}else{all.push({...item,searchQuery:base,refinedQuery:query(),selectedFromImageSearch:true,collectedAt:new Date().toISOString(),kind:'image-seed'});card.classList.add('selected')}write(all.slice(-500));count()}function googleUrl(q=query()){return `https://www.google.com/search?tbm=isch&hl=en&safe=active&q=${encodeURIComponent(q)}`}document.getElementById('googleTop').href=googleUrl();document.getElementById('googleBottom').href=googleUrl();function build(){const picks=selected();if(!picks.length){alert('Select at least one image first.');return}const u=new URL('../overview/',location.href);u.searchParams.set('q',base);u.searchParams.set('images','selected');u.searchParams.set('visualBuild',Date.now());location.assign(u.href)}document.querySelectorAll('[data-build]').forEach(b=>b.onclick=build);count();document.getElementById('refine').onsubmit=e=>{e.preventDefault();const r=document.getElementById('refineInput').value.trim(),u=new URL(location.href);if(r)u.searchParams.set('refine',r);else u.searchParams.delete('refine');location.assign(u.href)};const chips=['photography','illustration','diagram','historic','modern','people','places','products','art','posters'];document.getElementById('chips').innerHTML=chips.map(x=>`<button type="button" data-chip="${x}">+ ${x}</button>`).join('');document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{document.getElementById('refineInput').value=[extra,b.dataset.chip].filter(Boolean).join(' ');document.getElementById('refine').requestSubmit()});async function commons(q,offset){try{const u=`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=50&gsroffset=${offset}&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=900&format=json&origin=*`,r=await fetch(u,{cache:'no-store'}),j=await r.json();return Object.values(j.query?.pages||{}).map(x=>({image:x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url,title:(x.title||'').replace(/^File:/,''),sourceUrl:x.imageinfo?.[0]?.descriptionurl||'',provider:'Wikimedia Commons'})).filter(x=>x.image)}catch{return[]}}async function openverse(q,n){try{const r=await fetch(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(q)}&page_size=50&page=${n+1}`,{cache:'no-store'});if(!r.ok)return[];const j=await r.json();return(j.results||[]).map(x=>({image:x.thumbnail||x.url,title:x.title||q,sourceUrl:x.foreign_landing_url||x.detail_url||'',provider:x.source||'Openverse'})).filter(x=>x.image)}catch{return[]}}async function wikipedia(q){try{const u=`https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=30&prop=pageimages|info&pithumbsize=900&inprop=url&format=json&origin=*`,r=await fetch(u,{cache:'no-store'}),j=await r.json();return Object.values(j.query?.pages||{}).map(x=>({image:x.thumbnail?.source,title:x.title,sourceUrl:x.fullurl||'',provider:'Wikipedia image'})).filter(x=>x.image)}catch{return[]}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function append(items){const chosen=new Set(selected().map(key));let added=0;items.forEach(item=>{if(!item.image||seen.has(item.image))return;seen.add(item.image);added++;const c=document.createElement('article');c.className='photo'+(chosen.has(key(item))?' selected':'');c.innerHTML=`<img loading="lazy" alt="${esc(item.title||query())}"><div class="caption">${esc(item.title||query())}<span class="provider">${esc(item.provider||'image source')}</span></div>`;const im=c.querySelector('img');im.src=item.image;im.onerror=()=>c.remove();c.onclick=()=>toggle(item,c);grid.appendChild(c)});return added}async function load(){if(busy)return;busy=true;if(page===0)grid.innerHTML='';document.getElementById('more').textContent='Searching…';const q=query();const groups=await Promise.all([commons(q,page*50),openverse(q,page),wikipedia(q)]);const added=append(groups.flat());if(!seen.size)grid.innerHTML=`<div class="notice">No embeddable images returned yet for <b>${esc(q)}</b>. Try a shorter refinement, or open Google Images above while keeping this Omni selection workspace open.</div>`;page++;busy=false;document.getElementById('more').textContent=added?'Load more images ↓':'Try more images ↓'}document.getElementById('more').onclick=load;load()})();</script></body></html>
