<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

</head>
<body class="cosmic-index">
  <picture class="cosmic-art" aria-hidden="true">
    <source media="(max-width: 700px)" srcset="assets/omni-phi-background-mobile.jpg" />
    <img src="assets/omni-phi-background-wide.jpg" alt="" />
  </picture>
  <main class="cosmic-stage" id="indexHero">
    <button class="cosmic-menu" type="button" data-open-menu aria-label="Open Omni Phi menu"><span></span><span></span><span></span></button>
    <header class="cosmic-brand">
      <h1>OMNI PHI</h1><p>proportional search</p><small>all things connect <b>•</b> in proportion</small>
    </header>
    <section class="mode-row cosmic-modes" role="group" aria-label="Omni Phi mode">
      <button class="mode-button active" type="button" data-mode="search"><b>⌕</b><span>Search <i>φ</i><small>Discover</small></span></button>
      <button class="mode-button" type="button" data-mode="images"><b>▧</b><span>Images <i>φ</i><small>Photo results</small></span></button>
      <button class="mode-button" type="button" data-mode="code"><b>&lt;/&gt;</b><span>Code <i>φ</i><small>Build</small></span></button>
      <button class="mode-button" type="button" data-mode="create"><b>✧</b><span>Create <i>φ</i><small>Bring to life</small></span></button>
    </section>
    <section class="search-deck" aria-label="Search Omni Phi">
      <form class="search-shell" id="searchForm">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m15.8 15.8 4.3 4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <label class="sr-only" for="searchInput">Search Omni Phi</label>
        <textarea class="search-input" id="searchInput" name="q" rows="1" maxlength="1000" autocomplete="off" placeholder="Search the universe in proportion…"></textarea>
        <span class="query-count" id="queryCount" aria-live="polite">0/1000</span>
        <button class="search-submit" type="submit" aria-label="Run Omni Phi search">φ</button>
      </form>
      <div class="suggestion-panel" id="suggestionPanel"><div class="suggestion-head"><span>Suggestions</span><span>Explore further</span></div><div id="suggestionList"></div></div>
    </section>
    <p class="sr-only">All things connect in proportion. Knowledge flows further.</p>
  </main>
  <script src="assets/omni-family.js"></script><script src="assets/indexer.js"></script><script src="https://www-infinity4.github.io/Control-Phi/control-phi.js?v=20260913-click1"></script><script src="assets/app.js"></script><script src="assets/capability-router.js"></script><script src="assets/smart-search.js"></script>
  <script>
    const input=document.getElementById('searchInput'),form=document.getElementById('searchForm'),searchDeck=document.querySelector('.search-deck'),count=document.getElementById('queryCount'),suggestionList=document.getElementById('suggestionList'),modeButtons=[...document.querySelectorAll('[data-mode]')];
    let mode=localStorage.getItem(OmniPhi.STORAGE.mode)||'search';
    const nextIdeas=['Palladium element 46','Hydrogen selenium nitrogen compatibility','Omni Presence tools','Build structured research cards'];
    function setMode(next,shouldFocus=true){mode=next;localStorage.setItem(OmniPhi.STORAGE.mode,mode);modeButtons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));input.placeholder=mode==='code'?'What do you want to code?':mode==='create'?'What do you want to create?':mode==='images'?'Search images to click, collect, and build from…':'Search the universe in proportion…';if(shouldFocus)input.focus();}
    function searches(){let history=[];try{history=JSON.parse(localStorage.getItem(OmniPhi.STORAGE.history)||'[]')}catch{}const recent=history.map(e=>e.query).filter(Boolean).slice(0,2);return[...new Set([...recent,...nextIdeas])].slice(0,4)}
    function renderSuggestions(){suggestionList.innerHTML=searches().map(q=>`<button class="suggestion" type="button" data-query="${OmniPhi.escapeHtml(q)}"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>${OmniPhi.escapeHtml(q)}</span><b>›</b></button>`).join('');suggestionList.querySelectorAll('[data-query]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.query;updateInput();form.requestSubmit()}))}
    function updateInput(){input.style.height='auto';input.style.height=`${Math.min(input.scrollHeight,116)}px`;count.textContent=`${input.value.length}/1000`;searchDeck.classList.toggle('has-query',Boolean(input.value))}
    function destinationForMode(q){const params=new URLSearchParams({q});if(mode==='images')return `${OmniPhi.url('images/')}?${params}`;if(mode==='code')return `https://www-infinity4.github.io/C13b0/phi/code/?${params}`;if(mode==='create')return `https://www-infinity4.github.io/C13b0/phi/create/?${params}`;params.set('mode',mode);return `${OmniPhi.url('overview/')}?${params}`}
    modeButtons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));input.addEventListener('input',updateInput);input.addEventListener('focus',()=>searchDeck.classList.add('suggestions-open'));input.addEventListener('keydown',e=>{if(e.key==='Escape'){searchDeck.classList.remove('suggestions-open');input.blur()}});document.addEventListener('pointerdown',e=>{if(!searchDeck.contains(e.target))searchDeck.classList.remove('suggestions-open')});form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q){input.focus();return}location.href=destinationForMode(q)});
    if(!modeButtons.some(b=>b.dataset.mode===mode))mode='search';setMode(mode,false);renderSuggestions();updateInput();OmniPhi.setupMenu();
  </script>
  <script src="assets/gpt-mode.js?v=20260913-1"></script>
</body>
</html>
