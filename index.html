const input=document.getElementById('searchInput'),form=document.getElementById('searchForm'),searchDeck=document.querySelector('.search-deck'),count=document.getElementById('queryCount'),suggestionList=document.getElementById('suggestionList'),modeButtons=[...document.querySelectorAll('[data-mode]')];let mode=localStorage.getItem(OmniPhi.STORAGE.mode)||'search';const nextIdeas=['Palladium element 46','Hydrogen selenium nitrogen compatibility','Omni Presence tools','Build structured research cards'];
const GUEST='starquest_guest_profile_v1',SESSION='starquest_session',USERS='starquest_users';const jread=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},jwrite=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

tySearch(q);location.href=destinationForMode(q)}};setMode(mode,false);renderSuggestions();updateInput();OmniPhi.setupMenu();</script><script src="assets/gpt-mode.js?v=20260913-1"></script></body></html>
