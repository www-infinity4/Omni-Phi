<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Omni Phi — Proportional Search</title>
  <meta name="description" content="Search, code, and create through Omni Phi's proportional research field." />
  <meta name="theme-color" content="#08031f" />
  <link rel="canonical" href="https://www-infinity4.github.io/Omni-Phi/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www-infinity4.github.io/Omni-Phi/" />
  <meta property="og:title" content="Omni Phi — Proportional Search" />
  <meta property="og:description" content="All things connect, in proportion. Search, code, and create with Omni Phi." />
  <meta property="og:image" content="https://www-infinity4.github.io/Omni-Phi/assets/omni-phi-index-wide.jpg?v=2" />
  <meta property="og:image:width" content="1536" />
  <meta property="og:image:height" content="864" />
  <meta property="og:image:alt" content="Omni Phi proportional search over a violet and blue cosmic horizon" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Omni Phi — Proportional Search" />
  <meta name="twitter:description" content="All things connect, in proportion. Search, code, and create with Omni Phi." />
  <meta name="twitter:image" content="https://www-infinity4.github.io/Omni-Phi/assets/omni-phi-index-wide.jpg?v=2" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/index-v3.css" />
</head>
<body class="cosmic-index">
  <picture class="cosmic-art" aria-hidden="true">
    <source media="(max-width: 700px)" srcset="assets/omni-phi-index-mobile.jpg" />
    <img src="assets/omni-phi-index-wide.jpg" alt="" />
  </picture>

  <main class="cosmic-stage" id="indexHero">
    <button class="cosmic-menu" type="button" data-open-menu aria-label="Open Omni Phi menu"><span></span><span></span><span></span></button>

    <h1 class="sr-only">Omni Phi proportional search</h1>

    <section class="mode-row cosmic-modes" role="group" aria-label="Omni Phi mode">
      <button class="mode-button active" type="button" data-mode="search"><b>⌕</b><span>Search <i>φ</i><small>Discover</small></span></button>
      <button class="mode-button" type="button" data-mode="code"><b>&lt;/&gt;</b><span>Code <i>φ</i><small>Build</small></span></button>
      <button class="mode-button" type="button" data-mode="create"><b>✧</b><span>Create <i>φ</i><small>Bring to life</small></span></button>
    </section>

    <section class="search-deck" aria-label="Search Omni Phi">
      <form class="search-shell" id="searchForm">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m15.8 15.8 4.3 4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <label class="sr-only" for="searchInput">Search Omni Phi</label>
        <textarea class="search-input" id="searchInput" name="q" rows="1" maxlength="1000" autocomplete="off" placeholder="Search the universe in proportion…"></textarea>
        <span class="query-count" id="queryCount" aria-live="polite">0/1000</span>
        <button class="search-submit" type="submit" aria-label="Run Omni Phi search">φ</button>
      </form>

      <div class="suggestion-panel" id="suggestionPanel">
        <div class="suggestion-head"><span>Suggestions</span><span>Explore further</span></div>
        <div id="suggestionList"></div>
      </div>
    </section>

    <p class="sr-only">All things connect in proportion. Knowledge flows further.</p>
  </main>

  <script src="assets/omni-family.js"></script>
  <script src="assets/indexer.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/capability-router.js"></script>
  <script src="assets/smart-search.js"></script>
  <script>
    const input = document.getElementById('searchInput');
    const form = document.getElementById('searchForm');
    const count = document.getElementById('queryCount');
    const suggestionList = document.getElementById('suggestionList');
    const modeButtons = [...document.querySelectorAll('[data-mode]')];
    let mode = localStorage.getItem(OmniPhi.STORAGE.mode) || 'search';

    const nextIdeas = [
      'Palladium element 46',
      'Hydrogen selenium nitrogen compatibility',
      'Omni Presence tools',
      'Build structured research cards'
    ];

    function setMode(next, shouldFocus = true) {
      mode = next;
      localStorage.setItem(OmniPhi.STORAGE.mode, mode);
      modeButtons.forEach((button) => button.classList.toggle('active', button.dataset.mode === mode));
      input.placeholder = mode === 'code' ? 'What do you want to code?' : mode === 'create' ? 'What do you want to create?' : 'Search the universe in proportion…';
      if (shouldFocus) input.focus();
    }

    function searches() {
      let history = [];
      try { history = JSON.parse(localStorage.getItem(OmniPhi.STORAGE.history) || '[]'); } catch {}
      const recent = history.map((entry) => entry.query).filter(Boolean).slice(0, 2);
      return [...new Set([...recent, ...nextIdeas])].slice(0, 4);
    }

    function renderSuggestions() {
      suggestionList.innerHTML = searches().map((query) => `<button class="suggestion" type="button" data-query="${OmniPhi.escapeHtml(query)}"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/><path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>${OmniPhi.escapeHtml(query)}</span><b>›</b></button>`).join('');
      suggestionList.querySelectorAll('[data-query]').forEach((button) => button.addEventListener('click', () => {
        input.value = button.dataset.query;
        updateInput();
        form.requestSubmit();
      }));
    }

    function updateInput() {
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, 116)}px`;
      count.textContent = `${input.value.length}/1000`;
    }

    modeButtons.forEach((button) => button.addEventListener('click', () => setMode(button.dataset.mode)));
    input.addEventListener('input', updateInput);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const q = input.value.trim();
      if (!q) { input.focus(); return; }
      location.href = `${OmniPhi.url('overview/')}?${new URLSearchParams({ q, mode })}`;
    });

    setMode(mode, false);
    renderSuggestions();
    updateInput();
    OmniPhi.setupMenu();
  </script>
</body>
</html>
