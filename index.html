const input=document.getElementById('searchInput'),form=document.getElementById('searchForm'),searchDeck=document.querySelector('.search-deck'),count=document.getElementById('queryCount'),suggestionList=document.getElementById('suggestionList'),modeButtons=[...document.querySelectorAll('[data-mode]')];let mode=localStorage.getItem(OmniPhi.STORAGE.mode)||'search';const nextIdeas=['Palladium element 46','Hydrogen selenium nitrogen compatibility','Omni Presence tools','Build structured research cards'];

async function refreshUnifiedTokenCount(){const el=document.getElementById('infinityBalance');if(!el)return;try{const tokens=await OmniPhi.loadInfinityTokenLedger(),stable=window.InfinityTokenCount?.reconcile?.(tokens.length)?.value??tokens.length;const owned=window.PhiAssetBalances?.snapshot?.().INFINITY;el.textContent=String(owned&&(owned.cloud||owned.pending)?owned.balance:stable);el.dataset.source='stable-unified-token-count'}catch{el.textContent=String(window.InfinityTokenCount?.value?.()??'—');el.dataset.source='stable-unified-token-count'}}

async function connectAuthoritativeWallet(){showInfinityBalance();if(typeof window.InfinityUnifiedWallet!=='function')return null;try{authoritativeWallet=authoritativeWallet||new window.InfinityUnifiedWallet({appName:'Omni Phi'});authoritativeWallet.subscribe?.(showInfinityBalance);let state=await authoritativeWallet.connect();const legacy=jread('infinity_unified_wallet_v1',{}),profile=infinityStore().p||{},legacyInfinity=Math.max(0,Number(legacy.infinityTokens)||0,Number(profile.infinityTokens)||0);if(legacyInfinity>Number(state?.balances?.INFINITY||0)){await authoritativeWallet.importLegacy({importKey:'github-pages-infinity-v1',balances:{INFINITY:legacyInfinity},tokens:[]});state=await authoritativeWallet.refresh()}window.InfinityTokenCount?.reconcile?.(Number(state?.balances?.INFINITY)||0);showInfinityBalance(state);window.dispatchEvent(new CustomEvent('omni:wallet-ready',{detail:state}));return authoritativeWallet}catch(err){console.warn('Omni authoritative wallet unavailable',err);return null}}
async function creditInfinitySearch(q){const now=Date.now(),tokenId='omni-'+now.toString(36)+'-'+Math.random().toString(36).slice(2,8),pending=jread('omniPhi:pendingInfinitySearches:v1',[]),record={tokenId,query:q,source:'OMNI_PHI',createdAt:now,status:'pending'};jwrite('omniPhi:pendingInfinitySearches:v1',[...(Array.isArray(pending)?pending:[]),record].slice(-250));try{localStorage.setItem('omniPhi:lastSearchToken:v1',JSON.stringify(record))}catch{}await OmniPhi.createUnifiedSearchToken(q,tokenId);await refreshUnifiedTokenCount();return tokenId;}

'video')return`${OmniPhi.url('video/')}?${params}`;if(mode==='audio')return`${OmniPhi.url('audio/')}?${params}`;params.set('mode',mode);return`${OmniPhi.url('overview/')}?${params}`}modeButtons.forEach(b=>b.onclick=()=>setMode(b.dataset.mode));input.oninput=updateInput;form.onsubmit=async e=>{e.preventDefault();const q=input.value.trim();if(q){const token=await creditInfinitySearch(q);void creditAuthoritativeInfinitySearch(q,token).catch(err=>console.warn('Omni search credit queued',err));if(mode==='code'){const params=new URLSearchParams({q,token});try{localStorage.setItem('omniPhi:codeSeed:v1',JSON.stringify({tokenId:token,query:q,source:'omni-main-search',createdAt:new Date().toISOString()}))}catch{}location.href=`${OmniPhi.url('code/')}?${params}`;return}location.href=destinationForMode(q,token)}};setMode(mode,false);renderSuggestions();updateInput();OmniPhi.setupMenu();let retrying=false;async function retryPendingSearches(){if(retrying)return;retrying=true;try{for(const item of jread('omniPhi:pendingInfinitySearches:v1',[])){try{await creditAuthoritativeInfinitySearch(item.query,item.tokenId)}catch{break}}}finally{retrying=false}}for(const event of ['load','online','focus'])window.addEventListener(event,retryPendingSearches);const startWalletSync=()=>connectAuthoritativeWallet().then(retryPendingSearches).catch(()=>null);if("requestIdleCallback" in window)requestIdleCallback(startWalletSync,{timeout:2500});else setTimeout(startWalletSync,1200);refreshUnifiedTokenCount();window.addEventListener('infinity:token-ledger-updated',refreshUnifiedTokenCount);window.addEventListener('infinity-history-updated',refreshUnifiedTokenCount);window.addEventListener('phi:asset-balances',refreshUnifiedTokenCount);</script><script src="assets/gpt-mode.js?v=20260913-1"></script></body></html>
