<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Omni Phi — Shared Research Card</title>
  <meta name="description" content="Open a shared Omni Phi research card with its source context and connected search path." />
  <meta name="theme-color" content="#08031f" />
  <link rel="canonical" href="https://www-infinity4.github.io/Omni-Phi/share/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Omni Phi" />
  <meta property="og:url" content="https://www-infinity4.github.io/Omni-Phi/share/" />
  <meta property="og:title" content="Omni Phi — Shared Research Card" />
  <meta property="og:description" content="A shared Omni Phi card with its research context, source path, and connected search." />
  <meta property="og:image" content="https://www-infinity4.github.io/C13b0/infinity-phi-share.png?v=20260915-omni-share2" />
  <meta property="og:image:width" content="1536" />
  <meta property="og:image:height" content="1024" />
  <meta property="og:image:alt" content="Infinity Phi search-card preview" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Omni Phi — Shared Research Card" />
  <meta name="twitter:description" content="Open the shared Omni Phi card and continue the connected search." />
  <meta name="twitter:image" content="https://www-infinity4.github.io/C13b0/infinity-phi-share.png?v=20260915-omni-share2" />
  <style>
    html,body{min-height:100%;margin:0;background:#08031f;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;text-align:center}
    main{max-width:620px;padding:28px;border:1px solid rgba(210,160,255,.35);border-radius:24px;background:rgba(23,12,61,.92)}
    h1{margin:0 0 10px}p{color:#d8ccef;line-height:1.6}a{color:#ffe45e;font-weight:900}
  </style>
</head>
<body>
  <main>
    <h1>Omni Phi</h1>
    <p>Opening the shared research card.</p>
    <p><a id="openCard" href="../">Open Omni Phi</a></p>
  </main>
  <script>
    (() => {
      const raw = new URL(location.href).searchParams.get('target') || '';
      let target = null;
      try {
        const candidate = new URL(raw, location.origin);
        const allowed = candidate.origin === location.origin && candidate.pathname.startsWith('/Omni-Phi/');
        if (allowed && !candidate.pathname.startsWith('/Omni-Phi/share/')) target = candidate;
      } catch (_) {}
      if (!target) return;
      document.getElementById('openCard').href = target.toString();
      location.replace(target.toString());
    })();
  </script>
</body>
</html>
