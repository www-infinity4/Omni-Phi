name: Deploy Omni Phi to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply shared Infinity card skin, card depth, source truth, storyboard, image stream, and clean sharing
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          public_urls = {
              "overview/index.html": "https://www-infinity4.github.io/Omni-Phi/overview/",
              "cards/index.html": "https://www-infinity4.github.io/Omni-Phi/cards/",
              "structured/index.html": "https://www-infinity4.github.io/Omni-Phi/structured/",
          }
          share_image = "https://www-infinity4.github.io/C13b0/infinity-phi-share.png?v=20260915-omni-share1"
          consensus = '<script src="../assets/purple-consensus-v5.js?v=20260916-1"></script>'
          image_stream = '<script src="../assets/image-stream-v2.js?v=20260916-visual2"></script>'
          image_search = '<script src="../assets/image-search-v4.js?v=20260916-google2"></script>'
          share_export = '<script src="../assets/orange-card-share-export.js?v=20260916-orange-share1"></script>'

          for name in ("overview/index.html", "cards/index.html", "structured/index.html"):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              href = "../assets/infinity-card-skin.css"
              if href not in text:
                  text = text.replace("</head>", f'  <link rel="stylesheet" href="{href}" />\n</head>')

              if 'name="twitter:card"' not in text:
                  public_url = public_urls[name]
                  social = "\n".join([
                      f'  <link rel="canonical" href="{public_url}" />',
                      '  <meta property="og:type" content="website" />',
                      '  <meta property="og:site_name" content="Omni Phi" />',
                      f'  <meta property="og:url" content="{public_url}" />',
                      '  <meta property="og:title" content="Omni Phi — Proportional Search" />',
                      '  <meta property="og:description" content="A proportional Omni Phi research card with its source context and connected search path." />',
                      f'  <meta property="og:image" content="{share_image}" />',
                      '  <meta property="og:image:width" content="1536" />',
                      '  <meta property="og:image:height" content="1024" />',
                      '  <meta name="twitter:card" content="summary_large_image" />',
                      '  <meta name="twitter:title" content="Omni Phi — Proportional Search" />',
                      '  <meta name="twitter:description" content="Open the shared Omni Phi research card and continue the connected search." />',
                      f'  <meta name="twitter:image" content="{share_image}" />',
                  ])
                  text = text.replace("</head>", f'{social}\n</head>')

              if consensus not in text:
                  match = re.search(r'<script src="\.\./assets/site-intelligence\.js[^\"]*"></script>', text)
                  if match:
                      text = text[:match.end()] + f'\n  {consensus}' + text[match.end():]

              runtime = '<script src="../assets/omni-card-parity.js"></script>'
              if runtime not in text:
                  smart = '<script src="../assets/smart-search.js"></script>'
                  if smart in text:
                      text = text.replace(smart, f'{smart}\n  {runtime}', 1)
                  else:
                      text = text.replace("</body>", f'  {runtime}\n</body>')

              metadata = '<script src="../assets/collect-source-metadata.js?v=20260915-2"></script>'
              if metadata not in text:
                  app = '<script src="../assets/app.js"></script>'
                  if app in text:
                      text = text.replace(app, f'{app}\n  {metadata}', 1)

              sports_lock = '<script src="../assets/sports-source-lock.js?v=20260915-1"></script>'
              if sports_lock not in text:
                  pipeline = '<script src="../assets/card-pipeline.js"></script>'
                  if pipeline in text:
                      text = text.replace(pipeline, f'{sports_lock}\n  {pipeline}', 1)

              if image_stream not in text:
                  match = re.search(r'<script src="\.\./assets/card-pipeline\.js[^\"]*"></script>', text)
                  if match:
                      text = text[:match.end()] + f'\n  {image_stream}' + text[match.end():]
                  else:
                      text = text.replace("</body>", f'  {image_stream}\n</body>')

              if name == "overview/index.html" and image_search not in text:
                  if image_stream in text:
                      text = text.replace(image_stream, f'{image_stream}\n  {image_search}', 1)
                  else:
                      text = text.replace("</body>", f'  {image_search}\n</body>')

              clean_share = '<script src="../assets/share-clean-url.js?v=20260915-clean2"></script>'
              if clean_share not in text:
                  match = re.search(r'<script src="\.\./assets/card-pipeline\.js[^\"]*"></script>', text)
                  if match:
                      text = text[:match.end()] + f'\n  {clean_share}' + text[match.end():]

              if share_export not in text:
                  if image_stream in text:
                      text = text.replace(image_stream, f'{image_stream}\n  {share_export}', 1)
                  else:
                      text = text.replace("</body>", f'  {share_export}\n</body>')

              if name == "overview/index.html":
                  storyboard = '<script src="../assets/overview-storyboard.js"></script>'
                  if storyboard not in text:
                      if consensus in text:
                          text = text.replace(consensus, f'{consensus}\n  {storyboard}', 1)
                      else:
                          intelligence = '<script src="../assets/site-intelligence.js"></script>'
                          if intelligence in text:
                              text = text.replace(intelligence, f'{intelligence}\n  {storyboard}', 1)
                          else:
                              text = text.replace("</body>", f'  {storyboard}\n</body>')
              path.write_text(text)

          auto = Path("autobuild/index.html")
          if auto.exists():
              text = auto.read_text()
              if consensus not in text:
                  match = re.search(r'<script src="\.\./assets/site-intelligence\.js[^\"]*"></script>', text)
                  if match:
                      text = text[:match.end()] + f'\n  {consensus}' + text[match.end():]
              if image_stream not in text:
                  match = re.search(r'<script src="\.\./assets/card-pipeline\.js[^\"]*"></script>', text)
                  if match:
                      text = text[:match.end()] + f'\n  {image_stream}' + text[match.end():]
              if share_export not in text:
                  if image_stream in text:
                      text = text.replace(image_stream, f'{image_stream}\n  {share_export}', 1)
                  else:
                      text = text.replace("</body>", f'  {share_export}\n</body>')
              auto.write_text(text)

          build = Path("build/index.html")
          if build.exists():
              text = build.read_text()
              runtime = '<script src="../assets/site-schematic-runtime-v5.js?v=20260916-1"></script>'
              if runtime not in text:
                  builder = re.search(r'<script src="\.\./assets/site-builder-v2\.js[^\"]*"></script>', text)
                  if builder:
                      text = text[:builder.end()] + f'\n  {runtime}' + text[builder.end():]
                  else:
                      text = text.replace("</body>", f'  {runtime}\n</body>')
              build.write_text(text)
          PY
      - name: Verify Omni Phi visual contract
        run: |
          test -f assets/image-stream-v2.js
          test -f assets/image-search-v4.js
          test -f assets/orange-card-share-export.js
          grep -q 'image-stream-v2.js' overview/index.html
          grep -q 'image-search-v4.js' overview/index.html
          grep -q 'image-stream-v2.js' cards/index.html
          grep -q 'image-stream-v2.js' structured/index.html
          grep -q 'orange-card-share-export.js' overview/index.html
          grep -q 'orange-card-share-export.js' cards/index.html
          grep -q 'card-pipeline.js' overview/index.html
          grep -q 'site-intelligence.js' cards/index.html
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
