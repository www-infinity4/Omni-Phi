name: Deploy Omni Phi to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply shared Infinity card skin, card depth, source truth, and storyboard
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ("overview/index.html", "cards/index.html", "structured/index.html"):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              href = "../assets/infinity-card-skin.css"
              if href not in text:
                  text = text.replace("</head>", f'  <link rel="stylesheet" href="{href}" />\n</head>')

              # The card-depth guard MUST be active before multi-source retrieval
              # calls GPT enrichment. Loading it at </body> was too late and let
              # a one-card GPT response collapse the whole orange evidence field.
              runtime = '<script src="../assets/omni-card-parity.js"></script>'
              if runtime not in text:
                  smart = '<script src="../assets/smart-search.js"></script>'
                  if smart in text:
                      text = text.replace(smart, f'{smart}\n  {runtime}', 1)
                  else:
                      text = text.replace("</body>", f'  {runtime}\n</body>')

              # Preserve original source title/extract/image when a user collects
              # an orange card so News Phi receives factual source metadata.
              metadata = '<script src="../assets/collect-source-metadata.js?v=20260915-1"></script>'
              if metadata not in text:
                  app = '<script src="../assets/app.js"></script>'
                  if app in text:
                      text = text.replace(app, f'{app}\n  {metadata}', 1)

              # Sports/statistical cards keep the original source text after
              # semantic retrieval instead of publishing rewritten statistics.
              sports_lock = '<script src="../assets/sports-source-lock.js?v=20260915-1"></script>'
              if sports_lock not in text:
                  pipeline = '<script src="../assets/card-pipeline.js"></script>'
                  if pipeline in text:
                      text = text.replace(pipeline, f'{sports_lock}\n  {pipeline}', 1)

              if name == "overview/index.html":
                  storyboard = '<script src="../assets/overview-storyboard.js"></script>'
                  if storyboard not in text:
                      intelligence = '<script src="../assets/site-intelligence.js"></script>'
                      if intelligence in text:
                          text = text.replace(intelligence, f'{intelligence}\n  {storyboard}', 1)
                      else:
                          text = text.replace("</body>", f'  {storyboard}\n</body>')
              path.write_text(text)
          PY
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
