name: Deploy Omni Phi to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply shared Infinity card skin, card depth, source truth, storyboard, and clean sharing
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          public_urls = {
              "overview/index.html": "https://www-infinity4.github.io/Omni-Phi/overview/",
              "cards/index.html": "https://www-infinity4.github.io/Omni-Phi/cards/",
              "structured/index.html": "https://www-infinity4.github.io/Omni-Phi/structured/",
          }
          share_image = "https://www-infinity4.github.io/C13b0/infinity-phi-share.png?v=20260915-omni-share1"

          for name in ("overview/index.html", "cards/index.html", "structured/index.html"):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              href = "../assets/infinity-card-skin.css"
              if href not in text:
                  text = text.replace("</head>", f'  <link rel="stylesheet" href="{href}" />\n</head>')

              # Give X/Twitter and other crawlers a large image and readable
              # description on the exact Omni page that is being shared.
              if 'name="twitter:card"' not in text:
                  public_url = public_urls[name]
                  social = "\n".join([
                      f'  <link rel="canonical" href="{public_url}" />',
                      '  <meta property="og:type" content="website" />',
                      '  <meta property="og:site_name" content="Omni Phi" />',
                      f'  <meta property="og:url" content="{public_url}" />',
                      '  <meta property="og:title" content="Omni Phi — Proportional Search" />',
                      '  <meta property="og:description" content="A proportional Omni Phi research card with its source context and connected search path." />',
                      f'  <meta property="og:image" content="{share_image}" />',
                      '  <meta property="og:image:width" content="1536" />',
                      '  <meta property="og:image:height" content="1024" />',
                      '  <meta name="twitter:card" content="summary_large_image" />',
                      '  <meta name="twitter:title" content="Omni Phi — Proportional Search" />',
                      '  <meta name="twitter:description" content="Open the shared Omni Phi research card and continue the connected search." />',
                      f'  <meta name="twitter:image" content="{share_image}" />',
                  ])
                  text = text.replace("</head>", f'{social}\n</head>')

              # The card-depth guard MUST be active before multi-source retrieval
              # calls GPT enrichment. Loading it at </body> was too late and let
              # a one-card GPT response collapse the whole orange evidence field.
              runtime = '<script src="../assets/omni-card-parity.js"></script>'
              if runtime not in text:
                  smart = '<script src="../assets/smart-search.js"></script>'
                  if smart in text:
                      text = text.replace(smart, f'{smart}\n  {runtime}', 1)
                  else:
                      text = text.replace("</body>", f'  {runtime}\n</body>')

              # Preserve original source title/extract/image when a user collects
              # an orange card so News Phi receives factual source metadata.
              metadata = '<script src="../assets/collect-source-metadata.js?v=20260915-2"></script>'
              if metadata not in text:
                  app = '<script src="../assets/app.js"></script>'
                  if app in text:
                      text = text.replace(app, f'{app}\n  {metadata}', 1)

              # Sports/statistical cards keep the original source text after
              # semantic retrieval instead of publishing rewritten statistics.
              sports_lock = '<script src="../assets/sports-source-lock.js?v=20260915-1"></script>'
              if sports_lock not in text:
                  pipeline = '<script src="../assets/card-pipeline.js"></script>'
                  if pipeline in text:
                      text = text.replace(pipeline, f'{sports_lock}\n  {pipeline}', 1)

              # Override only the share transport after the existing card/image
              # pipeline is loaded. Images, semantics, card depth and collection
              # logic stay untouched; only the public share URL changes.
              clean_share = '<script src="../assets/share-clean-url.js?v=20260915-clean2"></script>'
              if clean_share not in text:
                  match = re.search(r'<script src="\.\./assets/card-pipeline\.js[^\"]*"></script>', text)
                  if match:
                      text = text[:match.end()] + f'\n  {clean_share}' + text[match.end():]

              if name == "overview/index.html":
                  storyboard = '<script src="../assets/overview-storyboard.js"></script>'
                  if storyboard not in text:
                      intelligence = '<script src="../assets/site-intelligence.js"></script>'
                      if intelligence in text:
                          text = text.replace(intelligence, f'{intelligence}\n  {storyboard}', 1)
                      else:
                          text = text.replace("</body>", f'  {storyboard}\n</body>')
              path.write_text(text)
          PY
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
