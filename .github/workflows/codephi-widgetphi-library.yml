name: Code Phi Cloudflare card-library integration
on:
  pull_request:
    paths:
      - 'code/index.html'
      - 'code/widgetphi-library-bridge.js'
      - 'code/test/widgetphi-library-bridge.test.cjs'
      - '.github/workflows/codephi-widgetphi-library.yml'
  push:
    branches: [main]
    paths:
      - 'code/widgetphi-library-bridge.js'
      - '.github/workflows/codephi-widgetphi-library.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check code/widgetphi-library-bridge.js
          node --test code/test/widgetphi-library-bridge.test.cjs
