<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Generated Website</title>
  <meta name="description" content="A public website generated with Omni Phi." />
  <meta name="theme-color" content="#111318" />
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f6f8;color:#17191d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.site-wrap{min-height:100dvh}.public-header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #e1e4e8}.public-nav{width:min(1180px,94vw);min-height:70px;margin:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px}.menu-button{width:44px;height:44px;border:1px solid #d7dbe0;border-radius:13px;background:#fff;font-size:1.35rem;cursor:pointer}.brand{min-width:0;font-weight:950;font-size:clamp(1rem,3.5vw,1.35rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-actions{display:flex;align-items:center;gap:9px}.header-search{display:flex;align-items:center;width:min(360px,42vw);border:1px solid #d7dbe0;border-radius:999px;background:#fff;padding:0 12px}.header-search input{width:100%;border:0;outline:0;padding:11px 4px;background:transparent;font:inherit}.drawer{position:fixed;inset:70px auto 0 0;width:min(340px,88vw);z-index:50;background:#fff;border-right:1px solid #e1e4e8;box-shadow:18px 0 50px rgba(0,0,0,.12);transform:translateX(-104%);transition:transform .18s ease;padding:18px}.drawer.open{transform:translateX(0)}.drawer a{display:block;padding:13px 12px;border-radius:11px;color:#1b1d20;text-decoration:none;font-weight:850}.drawer a:hover{background:#f1f3f5}.drawer .drawer-title{padding:7px 12px 14px;color:#767c85;font-size:.75rem;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.hero{background:#12161c;color:#fff}.hero-inner{width:min(1180px,94vw);margin:auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:28px;align-items:center;padding:clamp(52px,8vw,92px) 0}.hero-copy .eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;font-weight:950;color:#b7c4d4}.hero h1{margin:.4rem 0 .8rem;font-size:clamp(2.4rem,8vw,5.4rem);line-height:.94;letter-spacing:-.045em}.hero p{max-width:720px;color:#d4d9e0;font-size:clamp(1rem,2.5vw,1.2rem);line-height:1.7}.hero-image{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:24px;background:#262c35;box-shadow:0 24px 70px rgba(0,0,0,.28)}.section{width:min(1180px,94vw);margin:auto;padding:58px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.section-head h2{margin:0;font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.03em}.section-head p{max-width:640px;margin:0;color:#656b74;line-height:1.6}.listing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.listing-card{position:relative;overflow:hidden;border:1px solid #e0e3e7;border-radius:20px;background:#fff;box-shadow:0 10px 32px rgba(17,22,29,.06)}.listing-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eceff2}.listing-copy{padding:18px}.listing-copy h3{margin:.1rem 0 .55rem;font-size:1.15rem}.listing-copy p{margin:.35rem 0;color:#666d76;line-height:1.55}.listing-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px}.price{font-size:1.1rem;font-weight:950}.shipping{font-size:.78rem;color:#777e86}.listing-action{display:inline-flex;margin-top:14px;padding:10px 13px;border-radius:11px;background:#151a21;color:#fff;text-decoration:none;font-weight:900;border:0;cursor:pointer}.publication-grid{display:grid;gap:22px}.publication-story{display:grid;grid-template-columns:minmax(220px,.75fr) minmax(0,1.25fr);gap:24px;overflow:hidden;border:1px solid #e0e3e7;border-radius:22px;background:#fff;padding:18px}.publication-story img{width:100%;height:100%;max-height:330px;object-fit:cover;border-radius:16px;background:#eceff2}.publication-story h2{margin:.1rem 0 .7rem;font-size:clamp(1.45rem,4vw,2.4rem)}.publication-story p{color:#5e656e;line-height:1.7}.source-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.source-links a{padding:8px 10px;border:1px solid #d9dde2;border-radius:10px;color:#3d4854;text-decoration:none;font-size:.82rem;font-weight:800}.about-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.info-card{border:1px solid #e0e3e7;border-radius:20px;background:#fff;padding:22px}.info-card h3{margin-top:0}.info-list{display:grid;gap:9px;color:#5f6670}.info-list a{color:#304d6d}.site-footer{margin-top:20px;background:#11151b;color:#c9cfd7}.footer-inner{width:min(1180px,94vw);margin:auto;padding:32px 0}.footer-inner strong{color:#fff}.owner-bar{position:sticky;top:70px;z-index:35;background:#2a1741;color:#fff;border-bottom:1px solid #5d3a79}.owner-inner{width:min(1180px,94vw);margin:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0}.owner-inner strong{margin-right:auto}.owner-inner button,.owner-inner a,.owner-upload{border:1px solid rgba(255,255,255,.25);border-radius:10px;background:#42245f;color:#fff;padding:8px 10px;text-decoration:none;font:800 .8rem/1 system-ui;cursor:pointer}.owner-upload input{display:none}.owner-badge{position:absolute;top:10px;right:10px;border:0;border-radius:10px;background:#2a1741;color:#fff;padding:7px 9px;font-size:.76rem;font-weight:900;cursor:pointer}.owner-empty{padding:24px;border:1px dashed #b5bbc3;border-radius:18px;color:#6c737c;background:#fff}.missing{width:min(720px,92vw);margin:12vh auto;padding:30px;border:1px solid #dfe3e8;border-radius:24px;background:#fff;text-align:center}.missing a{color:#3d4f69}.payment-note{margin-top:12px;padding:10px 12px;border:1px solid #d8dce2;border-radius:11px;background:#f8f9fb;color:#6b7179;font-size:.8rem}
    @media(max-width:760px){.public-nav{grid-template-columns:auto minmax(0,1fr)}.header-actions{grid-column:1/-1;padding-bottom:10px}.header-search{width:100%}.hero-inner,.publication-story,.about-grid{grid-template-columns:1fr}.hero-image{max-height:360px}.section{padding:40px 0}.owner-bar{top:112px}}
  </style>
</head>
<body>
  <div id="app"><div class="missing">Opening generated website…</div></div>

  <script src="../assets/omni-family.js"></script>
  <script src="../assets/indexer.js"></script>
  <script src="../assets/app.js"></script>
  <script src="../assets/site-intelligence.js?v=4"></script>
  <script src="../assets/site-builder-v2.js?v=1"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const siteId = params.get('site') || '';
    const ownerMode = params.get('owner') === '1';
    let site = window.OmniWebsiteIntelligence?.getSite(siteId);
    const app = document.getElementById('app');
    const SITES_KEY = 'omniPhi:generatedSites:v1';

    function e(value) { return window.OmniPhi?.escapeHtml ? OmniPhi.escapeHtml(value == null ? '' : value) : String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function sourceAt(index) { return site?.sources?.find(source => Number(source.index) === Number(index)); }
    function publicUrl() { const url = new URL(location.href); url.searchParams.delete('owner'); return url.toString(); }
    function builderUrl() { return `${OmniPhi.url('cards/')}?${new URLSearchParams({q:site?.query || '',mode:'search'})}`; }
    function readSites(){ try{return JSON.parse(localStorage.getItem(SITES_KEY)||'{}')||{}}catch{return {}} }
    function saveSite(){
      if(!site?.id)return false;
      const store=readSites();
      store[site.id]=site;
      try{localStorage.setItem(SITES_KEY,JSON.stringify(store));return true}catch{return false}
    }
    function safePrompt(label, current=''){ const next=window.prompt(label,current||''); return next===null?null:String(next).trim(); }

    if (!site) {
      app.innerHTML = `<div class="missing"><h1>Website not found on this device</h1><p>This site is still stored by its generated-site token in the browser profile that created it.</p><a href="${OmniPhi.url('cards/')}">Return to Website Builder</a></div>`;
    } else render();

    function defaultNav(kind){ return (kind==='storefront'||kind==='catalog')?['Home','Listings','About','Contact']:kind==='news'?['Home','Latest','Archive','About']:['Home','Explore','About','Contact']; }
    function navTarget(label){ const value=String(label||'').toLowerCase(); if(/listing|shop|catalog|product/.test(value))return '#listings'; if(/about|history/.test(value))return '#about'; if(/contact|location|business/.test(value))return '#contact'; if(/latest|archive|explore|story|research/.test(value))return '#stories'; return '#home'; }
    function deriveListings(spec){
      if(Array.isArray(spec?.storefront?.listings)&&spec.storefront.listings.length)return spec.storefront.listings;
      return (site.sources||[]).slice(0,12).map((source,index)=>({id:`listing-${index+1}`,title:source.title||`Listing ${index+1}`,description:source.text||'',price:'',shipping:'',image:source.image||'',sourceUrl:source.url||'',sourceIndex:index}));
    }
    function heroSource(spec){
      const listings=deriveListings(spec); const firstListing=listings.find(item=>item.image);
      if(firstListing)return {image:firstListing.image,title:firstListing.title};
      return (site.sources||[]).find(source=>source.image)||site.sources?.[0]||{};
    }

    function ownerBar(spec){
      if(!ownerMode)return '';
      return `<aside class="owner-bar"><div class="owner-inner"><strong>Owner mode · edits are hidden from public viewers</strong><a href="${e(publicUrl())}">View public</a><button id="editSite" type="button">Edit page</button>${(spec.kind==='storefront'||spec.kind==='catalog')?'<button id="addListing" type="button">+ Listing</button><label class="owner-upload">Upload images<input id="imageUpload" type="file" accept="image/*" multiple></label>':''}<a href="${e(builderUrl())}">Website Builder</a></div></aside>`;
    }

    function contactAction(spec, listing){
      if(listing?.checkoutUrl)return `<a class="listing-action" href="${e(listing.checkoutUrl)}" target="_blank" rel="noopener">Buy now</a>`;
      if(spec.business?.email)return `<a class="listing-action" href="mailto:${e(spec.business.email)}?subject=${encodeURIComponent(listing?.title||'Listing inquiry')}">Contact seller</a>`;
      if(spec.business?.phone)return `<a class="listing-action" href="tel:${e(spec.business.phone)}">Contact seller</a>`;
      if(listing?.sourceUrl)return `<a class="listing-action" href="${e(listing.sourceUrl)}" target="_blank" rel="noopener">View details</a>`;
      return ownerMode?'<div class="payment-note">Add contact or a real checkout connector before public purchase buttons appear.</div>':'';
    }

    function listingHtml(spec){
      const listings=deriveListings(spec);
      if(!listings.length)return ownerMode?'<div class="owner-empty">No listings yet. Use + Listing or Upload images.</div>':'';
      return `<div class="listing-grid">${listings.map((item,index)=>`<article class="listing-card" data-listing-card="${index}" data-search-text="${e(`${item.title||''} ${item.description||''} ${item.price||''}`.toLowerCase())}">${item.image?`<img src="${e(item.image)}" alt="${e(item.title||'Listing image')}" loading="lazy">`:'<div style="aspect-ratio:4/3;background:#eceff2"></div>'}${ownerMode?`<button class="owner-badge" type="button" data-edit-listing="${index}">Edit</button>`:''}<div class="listing-copy"><h3>${e(item.title||`Listing ${index+1}`)}</h3><p>${e(item.description||'')}</p><div class="listing-meta"><span class="price">${e(item.price||(ownerMode?'Price not set':'Contact for price'))}</span>${item.shipping?`<span class="shipping">${e(item.shipping)}</span>`:''}</div>${contactAction(spec,item)}</div></article>`).join('')}</div>`;
    }

    function storyHtml(spec){
      const sections=Array.isArray(spec.sections)?spec.sections:[];
      return `<div class="publication-grid">${sections.map((section,index)=>{
        const indexes=Array.isArray(section.sourceIndexes)?section.sourceIndexes:[];
        const sources=indexes.map(sourceAt).filter(Boolean);
        const lead=sources.find(source=>source.image)||site.sources?.[index]||site.sources?.[0]||{};
        const links=sources.length?sources:lead?[lead]:[];
        return `<article class="publication-story">${lead?.image?`<img src="${e(lead.image)}" alt="" loading="lazy">`:''}<div><div style="font-size:.72rem;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#707782">Story ${String(index+1).padStart(2,'0')}</div><h2>${e(section.heading||lead?.title||`Section ${index+1}`)}</h2><p>${e(section.copy||lead?.text||'')}</p><div class="source-links">${links.filter(source=>source?.url).map(source=>`<a href="${e(source.url)}" target="_blank" rel="noopener">${e(source.domain||'Source')}</a>`).join('')}</div></div></article>`;
      }).join('')}</div>`;
    }

    function render(){
      const spec=site.spec||{};
      spec.kind=spec.kind||'research';
      spec.brand=spec.brand||spec.title||site.title||site.query||'Website';
      spec.nav=Array.isArray(spec.nav)&&spec.nav.length?spec.nav:defaultNav(spec.kind);
      spec.business=spec.business||{};
      spec.storefront=spec.storefront||{};
      site.spec=spec;
      document.title=spec.title||spec.brand||site.title;
      const hero=heroSource(spec);
      const commerce=spec.kind==='storefront'||spec.kind==='catalog';
      const publication=spec.kind==='news'||spec.kind==='research';
      const navLinks=spec.nav.map(label=>`<a href="${navTarget(label)}">${e(label)}</a>`).join('');
      const search=commerce?`<label class="header-search"><span aria-hidden="true">⌕</span><input id="listingSearch" type="search" placeholder="Search listings" aria-label="Search listings"></label>`:'';
      const history=spec.business.history?`<p>${e(spec.business.history)}</p>`:'';
      const accounts=Array.isArray(spec.business.externalAccounts)?spec.business.externalAccounts.filter(item=>item?.url||item?.label):[];
      const hasContact=spec.business.phone||spec.business.email||spec.business.address||accounts.length;

      app.innerHTML=`<div class="site-wrap"><header class="public-header"><div class="public-nav"><button class="menu-button" id="menuButton" aria-label="Open menu" aria-expanded="false">☰</button><div class="brand">${e(spec.brand)}</div><div class="header-actions">${search}</div></div></header><nav class="drawer" id="drawer"><div class="drawer-title">${e(spec.brand)}</div>${navLinks}</nav>${ownerBar(spec)}<main id="home"><section class="hero"><div class="hero-inner"><div class="hero-copy"><div class="eyebrow">${e(spec.kind==='storefront'?'Storefront':spec.kind==='catalog'?'Catalog':spec.kind==='news'?'Publication':spec.kind==='business'?'Business':'Website')}</div><h1>${e(spec.title||spec.brand)}</h1><p>${e(spec.tagline||spec.subtitle||spec.summary||'')}</p></div>${hero?.image?`<img class="hero-image" src="${e(hero.image)}" alt="${e(hero.title||'')}">`:''}</div></section>${commerce?`<section class="section" id="listings"><div class="section-head"><div><h2>Listings</h2><p>${e(spec.storefront.intro||'Browse the current collection.')}</p></div></div>${listingHtml(spec)}</section>`:''}${publication?`<section class="section" id="stories"><div class="section-head"><div><h2>${spec.kind==='news'?'Latest stories':'Explore'}</h2><p>${e(spec.summary||'')}</p></div></div>${storyHtml(spec)}</section>`:''}${!commerce&&!publication?`<section class="section" id="stories"><div class="section-head"><div><h2>Explore</h2><p>${e(spec.summary||'')}</p></div></div>${storyHtml(spec)}</section>`:''}<section class="section" id="about"><div class="about-grid"><article class="info-card"><h3>About ${e(spec.brand)}</h3><p>${e(spec.summary||spec.tagline||'')}</p>${history}</article><article class="info-card" id="contact"><h3>Contact & business information</h3>${hasContact?`<div class="info-list">${spec.business.phone?`<div><strong>Phone:</strong> <a href="tel:${e(spec.business.phone)}">${e(spec.business.phone)}</a></div>`:''}${spec.business.email?`<div><strong>Email:</strong> <a href="mailto:${e(spec.business.email)}">${e(spec.business.email)}</a></div>`:''}${spec.business.address?`<div><strong>Address:</strong> ${e(spec.business.address)}</div>`:''}${accounts.map(item=>`<div><a href="${e(item.url)}" target="_blank" rel="noopener">${e(item.label||item.url)}</a></div>`).join('')}</div>`:`<p>${ownerMode?'Add verified business/contact details in owner mode.':'Contact information has not been published.'}</p>`}${ownerMode&&spec.payment?.status!=='connected'?'<div class="payment-note">Payments are not connected. A real provider connector must be added before checkout is shown to buyers.</div>':''}</article></div></section></main><footer class="site-footer"><div class="footer-inner"><strong>${e(spec.brand)}</strong><div>${e(spec.tagline||'')}</div></div></footer></div>`;

      const menu=document.getElementById('menuButton'); const drawer=document.getElementById('drawer');
      menu?.addEventListener('click',()=>{const open=drawer.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));});
      drawer?.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{drawer.classList.remove('open');menu?.setAttribute('aria-expanded','false');}));
      document.getElementById('listingSearch')?.addEventListener('input',event=>{const term=String(event.target.value||'').trim().toLowerCase();document.querySelectorAll('[data-listing-card]').forEach(card=>{card.hidden=Boolean(term)&&!String(card.dataset.searchText||'').includes(term);});});
      if(ownerMode)installOwnerControls();
    }

    function installOwnerControls(){
      document.getElementById('editSite')?.addEventListener('click',()=>{
        const spec=site.spec||{};
        const brand=safePrompt('Website / business name',spec.brand||spec.title||''); if(brand===null)return;
        const tagline=safePrompt('Homepage tagline / welcome text',spec.tagline||spec.subtitle||''); if(tagline===null)return;
        const summary=safePrompt('About this business/site',spec.summary||''); if(summary===null)return;
        const phone=safePrompt('Phone (leave blank if not published)',spec.business?.phone||''); if(phone===null)return;
        const email=safePrompt('Email (leave blank if not published)',spec.business?.email||''); if(email===null)return;
        const address=safePrompt('Business address (leave blank if not published)',spec.business?.address||''); if(address===null)return;
        spec.brand=brand||spec.brand; spec.title=brand||spec.title; spec.tagline=tagline; spec.subtitle=tagline; spec.summary=summary; spec.business={...(spec.business||{}),phone,email,address};
        site.title=spec.title||site.title; saveSite(); render();
      });

      document.getElementById('addListing')?.addEventListener('click',()=>{
        const spec=site.spec||{}; spec.storefront=spec.storefront||{}; spec.storefront.listings=deriveListings(spec);
        const title=safePrompt('Listing title',''); if(!title)return;
        const description=safePrompt('Description','')??''; const price=safePrompt('Price (example: $1.00)','')??''; const shipping=safePrompt('Shipping information','')??''; const image=safePrompt('Image URL (or leave blank and use Upload images)','')??'';
        spec.storefront.listings.unshift({id:`listing-${Date.now().toString(36)}`,title,description,price,shipping,image,sourceUrl:'',sourceIndex:-1});
        saveSite(); render();
      });

      document.querySelectorAll('[data-edit-listing]').forEach(button=>button.addEventListener('click',()=>{
        const spec=site.spec||{}; spec.storefront=spec.storefront||{}; spec.storefront.listings=deriveListings(spec);
        const index=Number(button.dataset.editListing); const item=spec.storefront.listings[index]; if(!item)return;
        const title=safePrompt('Listing title',item.title||''); if(title===null)return;
        const description=safePrompt('Description',item.description||''); if(description===null)return;
        const price=safePrompt('Price',item.price||''); if(price===null)return;
        const shipping=safePrompt('Shipping',item.shipping||''); if(shipping===null)return;
        const image=safePrompt('Image URL',item.image||''); if(image===null)return;
        Object.assign(item,{title,description,price,shipping,image}); saveSite(); render();
      }));

      document.getElementById('imageUpload')?.addEventListener('change',event=>{
        const files=[...(event.target.files||[])].slice(0,8); if(!files.length)return;
        const spec=site.spec||{}; spec.storefront=spec.storefront||{}; spec.storefront.listings=deriveListings(spec);
        let pending=files.length;
        files.forEach(file=>{
          if(file.size>1500000){pending-=1;if(!pending){saveSite();render();}return;}
          const reader=new FileReader();
          reader.onload=()=>{spec.storefront.listings.unshift({id:`listing-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`,title:file.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '),description:'',price:'',shipping:'',image:String(reader.result||''),sourceUrl:'',sourceIndex:-1});pending-=1;if(!pending){saveSite();render();}};
          reader.onerror=()=>{pending-=1;if(!pending){saveSite();render();}};
          reader.readAsDataURL(file);
        });
      });
    }
  </script>
</body>
</html>
