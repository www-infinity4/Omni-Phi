<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omni Phi audio</title><link rel="stylesheet" href="../assets/style.css"><style>body{font:16px system-ui;background:#fffdf8;color:#24152f;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.head h1{margin-right:auto}.nav,.btn,button{padding:10px 13px;border-radius:12px;border:1px solid #b86b12;background:#fff;font-weight:850;color:#542d00;text-decoration:none}.search{display:flex;gap:8px;margin:16px 0}.search input{flex:1;padding:12px;border:1px solid #c9b5d4;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.card{border:2px solid #ff8a1f;border-radius:22px;padding:14px;background:#fff;display:flex;flex-direction:column}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:15px}.card p{flex:1}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions>*{font-size:.78rem}.muted{color:#6d6074}</style></head><body><main class="wrap"><div class="head"><a class="nav" href="../">← Omni Phi</a><h1>Audio φ</h1><a class="nav" id="images">Images</a><a class="nav" id="other">Video</a><a class="nav" id="overview">AI Overview</a></div><form class="search" id="f"><input id="q" placeholder="Refine this token's Internet Archive audio"><button>Search</button></form><p class="muted" id="state"></p><section class="grid" id="out"></section></main><script>
const kind="audio",media="audio",p=new URLSearchParams(location.search),q=document.querySelector("#q"),out=document.querySelector("#out"),state=document.querySelector("#state"),token=p.get("token")||(()=>{try{return JSON.parse(localStorage.getItem("omniPhi:lastSearchToken:v1")||"null")?.tokenId}catch{return""}})()||("omni-"+Date.now()),base=p.get("q")||"";q.value=p.get("refine")||base;const clean=x=>String(Array.isArray(x)?x[0]:x||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(),esc=s=>clean(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));document.querySelector("#images").href="../images/?"+new URLSearchParams({q:base,token});document.querySelector("#other").href="../video/?"+new URLSearchParams({q:base,token});document.querySelector("#overview").href="../overview/?"+new URLSearchParams({q:base,token});
function collect(x,b){try{const key="omniPhi:mediaSelections:v1",a=JSON.parse(localStorage.getItem(key)||"[]"),card={id:x.identifier,title:clean(x.title)||x.identifier,extract:clean(x.description),url:"https://archive.org/details/"+encodeURIComponent(x.identifier),image:"https://archive.org/services/img/"+encodeURIComponent(x.identifier),provider:"Internet Archive",kind,storyKey:"archive:"+x.identifier,searchQuery:base,refinedQuery:q.value,tokenId:token,collectedAt:new Date().toISOString()},next=[card,...a.filter(v=>(v.storyKey||v.url)!==card.storyKey)].slice(0,250);localStorage.setItem(key,JSON.stringify(next));let shared=JSON.parse(localStorage.getItem("phiShared:collection:v1")||"[]");shared=[card,...shared.filter(v=>(v.storyKey||v.url)!==card.storyKey)].slice(0,250);localStorage.setItem("phiShared:collection:v1",JSON.stringify(shared));b.textContent="Collected ✓"}catch{b.textContent="Collect again"}}
async function share(x,b){if(!navigator.share){b.textContent="Android Share required";return}try{await navigator.share({title:clean(x.title),text:clean(x.description).slice(0,320),url:"https://archive.org/details/"+encodeURIComponent(x.identifier)});b.textContent="Shared ✓"}catch(e){if(e.name!=="AbortError")b.textContent="Share again"}}
async function run(){const term=q.value.trim()||base;if(!term)return;state.textContent="Searching Internet Archive audio for this token…";out.innerHTML="";const u=new URL("https://archive.org/advancedsearch.php");u.search=new URLSearchParams({q:"("+term+") AND mediatype:"+media,"fl[]":"identifier,title,description",rows:"20",output:"json"});try{const d=await(await fetch(u)).json(),docs=d.response?.docs||[];state.textContent=docs.length+" audio results · token "+token;docs.forEach(x=>{const a=document.createElement("article");a.className="card";a.innerHTML='<img loading="lazy" src="https://archive.org/services/img/'+encodeURIComponent(x.identifier)+'"><h2>'+esc(x.title||x.identifier)+'</h2><p>'+esc(clean(x.description).slice(0,340))+'</p><div class="actions"><button class="c">Collect to token</button><button class="s">Share</button><a class="btn" target="_blank" rel="noopener" href="https://archive.org/details/'+encodeURIComponent(x.identifier)+'">Archive source</a></div>';a.querySelector(".c").onclick=()=>collect(x,a.querySelector(".c"));a.querySelector(".s").onclick=()=>share(x,a.querySelector(".s"));out.append(a)});if(!docs.length)state.textContent="No audio results."}catch{state.textContent="Archive search failed. Try again."}}
document.querySelector("#f").onsubmit=e=>{e.preventDefault();const u=new URL(location.href);u.searchParams.set("q",base||q.value.trim());u.searchParams.set("token",token);u.searchParams.set("refine",q.value.trim());history.replaceState(null,"",u);run()};run();</script></body></html>
