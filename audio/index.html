<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omni Phi audio</title><style>body{font:16px system-ui;background:#fffdf8;color:#24152f;margin:0}.wrap{max-width:900px;margin:auto;padding:24px}.card{border:2px solid #ff8a1f;border-radius:22px;padding:16px;margin:18px 0;background:#fff}.card img{width:100%;max-height:280px;object-fit:cover;border-radius:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a{padding:10px 13px;border-radius:12px;border:1px solid #b86b12;background:#fff;font-weight:800;color:#542d00;text-decoration:none}audio,video{width:100%;margin-top:10px}</style><main class="wrap"><a href="../">← Omni Phi</a><h1>Audio φ</h1><form id="f"><input id="q" style="padding:12px;width:70%" placeholder="Search Internet Archive audio"><button>Search</button></form><section id="out"></section></main><script>
const kind="audio",q=document.querySelector("#q"),out=document.querySelector("#out"),SH="phiShared:collection:v1";q.value=new URLSearchParams(location.search).get("q")||"";
const clean=x=>String(Array.isArray(x)?x[0]:x||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
function collect(x,b){try{let a=JSON.parse(localStorage.getItem(SH)||"[]"),card={id:x.identifier,title:clean(x.title)||x.identifier,extract:clean(x.description),url:"https://archive.org/details/"+encodeURIComponent(x.identifier),image:"https://archive.org/services/img/"+encodeURIComponent(x.identifier),provider:"Internet Archive",kind,storyKey:"archive:"+x.identifier,searchQuery:q.value,collectedAt:new Date().toISOString()};a=[card,...a.filter(v=>(v.storyKey||v.url)!==card.storyKey)].slice(0,250);localStorage.setItem(SH,JSON.stringify(a));b.textContent="Collected ✓"}catch{b.textContent="Collect again"}}
function credit(ref){let w=JSON.parse(localStorage.getItem("starquest_guest_profile_v1")||'{"tokens":0,"shareCount":0,"pendingShareCredits":0}');w.shareCount=(+w.shareCount||0)+1;w.pendingShareCredits=(+w.pendingShareCredits||0)+1;while(w.pendingShareCredits>=10){w.pendingShareCredits-=10;w.tokens=(+w.tokens||0)+1}localStorage.setItem("starquest_guest_profile_v1",JSON.stringify(w));return w.pendingShareCredits}
async function share(x,b){if(!navigator.share){b.textContent="Android Share required for ⭐";return}try{let url="https://archive.org/details/"+encodeURIComponent(x.identifier);await navigator.share({title:clean(x.title),text:clean(x.description).slice(0,320),url});b.textContent="Shared · "+credit(url)+"/10 ⭐"}catch(e){if(e.name!=="AbortError")b.textContent="Share again"}}
async function run(){let term=q.value.trim();if(!term)return;out.innerHTML="<p>Searching…</p>";let u=new URL("https://archive.org/advancedsearch.php");u.search=new URLSearchParams({q:'('+term+') AND mediatype:audio',"fl[]":"identifier,title,description",rows:"20",output:"json"});try{let d=await(await fetch(u)).json(),docs=d.response?.docs||[];out.innerHTML="";docs.forEach(x=>{let a=document.createElement("article");a.className="card";let src="https://archive.org/download/"+encodeURIComponent(x.identifier)+"/"+encodeURIComponent(x.identifier)+"_files.xml";a.innerHTML='<img src="https://archive.org/services/img/'+encodeURIComponent(x.identifier)+'"><h2>'+clean(x.title)+'</h2><p>'+clean(x.description).slice(0,300)+'</p><div class="actions"><button class="c">Collect card</button><button class="s">Share · +1/10 ⭐</button><a target="_blank" href="https://archive.org/details/'+encodeURIComponent(x.identifier)+'">Archive source</a></div>';a.querySelector(".c").onclick=()=>collect(x,a.querySelector(".c"));a.querySelector(".s").onclick=()=>share(x,a.querySelector(".s"));out.append(a)});if(!docs.length)out.innerHTML="<p>No results.</p>"}catch{out.innerHTML="<p>Archive search failed. Try again.</p>"}}
document.querySelector("#f").onsubmit=e=>{e.preventDefault();run()};if(q.value)run();
</script>
